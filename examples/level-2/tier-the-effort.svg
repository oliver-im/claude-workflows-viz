<svg xmlns="http://www.w3.org/2000/svg" width="781" height="778.5" viewBox="0 0 781 778.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="781" height="778.5" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="749" height="183" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="48" font-size="22" fill="#0f172a" font-weight="700">Tier the effort across a triage pipeline</text><text x="38" y="77" font-size="13.5" fill="#475569">Spend reasoning where it changes the answer: skim every crash report at the lowest tier,</text><text x="38" y="96" font-size="13.5" fill="#475569">root-cause each one at the highest, cross-examine the causes in between, and draft the</text><text x="38" y="115" font-size="13.5" fill="#475569">digest cheaply.</text><text x="38" y="144" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the work is wide but the hard part is narrow — a flat effort setting either</text><text x="38" y="161" font-size="12.5" fill="#64748b" font-style="italic">overpays on the skim or underpays on the adjudication.</text></g></g>
<g transform="translate(0 211)"><rect x="16" y="0" width="749" height="551.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="149" x2="765" y2="149" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="283" x2="765" y2="283" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="441.5" x2="765" y2="441.5" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>A mechanical pass per report: pull the stack frame, the build id, and the first reproducing step. Cheap by construction, so it runs at the lowest tier.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Skim every report</text><text x="72" y="54" font-size="12.5" fill="#475569">A mechanical pass per report: pull the stack</text><text x="72" y="71" font-size="12.5" fill="#475569">frame, the build id, and the first reproducing</text><text x="72" y="88" font-size="12.5" fill="#475569">step. Cheap by construction, so it runs at the</text><text x="72" y="105" font-size="12.5" fill="#475569">lowest tier.</text><circle cx="76" cy="120" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 149)"><g class="lane-label"><title>The one genuinely hard step, and the only one at the top tier — everything downstream is checking or restating its answer.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Root-cause each crash</text><text x="72" y="54" font-size="12.5" fill="#475569">The one genuinely hard step, and the only one</text><text x="72" y="71" font-size="12.5" fill="#475569">at the top tier — everything downstream is</text><text x="72" y="88" font-size="12.5" fill="#475569">checking or restating its answer.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 283)"><g class="lane-label"><title>Three lenses try to break each root cause. Demanding, but bounded by the cause already in hand, so a tier below the adjudication is enough.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Cross-examine the causes</text><text x="72" y="54" font-size="12.5" fill="#475569">Three lenses try to break each root cause.</text><text x="72" y="71" font-size="12.5" fill="#475569">Demanding, but bounded by the cause already in</text><text x="72" y="88" font-size="12.5" fill="#475569">hand, so a tier below the adjudication is</text><text x="72" y="105" font-size="12.5" fill="#475569">enough.</text><circle cx="76" cy="120" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 441.5)"><g class="lane-label"><title>Restating settled findings — a drafting job, not a reasoning one.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Write the digest</text><text x="72" y="54" font-size="12.5" fill="#475569">Restating settled findings — a drafting job,</text><text x="72" y="71" font-size="12.5" fill="#475569">not a reasoning one.</text><circle cx="76" cy="86" r="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="87" y="90" font-size="11.5" fill="#64748b">model: claude-fable-5</text></g></g><g class="topology" transform="translate(296 0)"><g class="edge"><path d="M 304 87 L 304 194" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,194 300.5,187 307.5,187" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 304 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="304,61 300.5,54 307.5,54" fill="#64748b"/></g><g class="edge"><path d="M 304 220 L 304 257" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 330 L 207.06 346" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="207.06,346 213.4,341.41 214.54,348.31" fill="#64748b"/></g><g class="edge"><path d="M 304 330 L 304 346" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="304,346 300.5,339 307.5,339" fill="#64748b"/></g><g class="edge"><path d="M 304 330 L 400.94 346" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="400.94,346 393.46,348.31 394.6,341.41" fill="#64748b"/></g><g class="edge"><path d="M 207.06 372 L 207.06 397.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 372 L 304 397.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 400.94 372 L 400.94 397.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 404.5 L 304 420.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,420.5 300.5,413.5 307.5,413.5" fill="#64748b"/></g><g class="edge"><path d="M 304 264 L 304 323" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,323 300.5,316 307.5,316" fill="#64748b"/></g><g class="edge"><path d="M 304 427.5 L 304 481.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,481.5 300.5,474.5 307.5,474.5" fill="#64748b"/></g><circle class="hub" cx="304" cy="41.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="306" cy="76" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><circle cx="304" cy="74" r="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">skim:${report}</text><text x="318" y="63" font-size="11" font-weight="700" fill="#e8694a">×N</text><g><title>effort: low</title><text x="290" y="63" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">low</text></g></g><g class="agent-node"><circle cx="304" cy="207" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="304" y="232" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">root-cause:${report}</text><g><title>effort: max</title><text x="290" y="196" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">max</text></g></g><circle class="hub" cx="304" cy="260.5" r="3.5" fill="#94a3b8"/><circle class="hub" cx="304" cy="326.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="207.06" cy="359" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="207.06" y="384" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:timing</text><g><title>effort: high</title><text x="193.06" y="348" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">high</text></g></g><g class="agent-node"><circle cx="304" cy="359" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="304" y="384" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:memory</text><g><title>effort: high</title><text x="290" y="348" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">high</text></g></g><g class="agent-node"><circle cx="400.94" cy="359" r="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="400.94" y="384" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:config</text><g><title>effort: high</title><text x="386.94" y="348" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">high</text></g></g><rect class="barrier" x="194.06" y="397.5" width="219.88" height="7" rx="3.5" fill="#e8694a"/><circle class="hub" cx="304" cy="424" r="3.5" fill="#94a3b8"/><g class="agent-node"><title>Write the triage digest for these root causes: ${JSON.stringify(standing)}</title><circle cx="304" cy="494.5" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.25"/><g><title>effort: low</title><text x="290" y="483.5" font-size="9.5" fill="#94a3b8" font-weight="600" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">low</text></g></g></g></g>

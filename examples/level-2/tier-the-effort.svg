<svg xmlns="http://www.w3.org/2000/svg" width="814" height="797" viewBox="0 0 814 797" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Tier the effort across a triage pipeline</title>
<desc>Spend reasoning where it changes the answer: skim every crash report at the lowest tier, root-cause each one at the highest, cross-examine the causes in between, and draft the digest cheaply.</desc>
<rect width="814" height="797" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="782" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Tier the effort across a triage pipeline</text><text x="40" y="72" font-size="13.5" fill="#475569">Spend reasoning where it changes the answer: skim every crash report at the lowest tier, root-cause each one at the</text><text x="40" y="92" font-size="13.5" fill="#475569">highest, cross-examine the causes in between, and draft the digest cheaply.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the work is wide but the hard part is narrow — a flat effort setting either overpays on the skim or underpays on</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">the adjudication.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">4 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">4 agent() calls</text><rect x="203" y="148" width="70" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×N</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="782" height="563" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="131" x2="798" y2="131" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="264" x2="798" y2="264" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="393" x2="798" y2="393" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>A mechanical pass per report: pull the stack frame, the build id, and the first reproducing step. Cheap by construction, so it runs at the lowest tier.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Skim every report</text><text x="72" y="54" font-size="12.5" fill="#475569">A mechanical pass per report: pull the stack frame,</text><text x="72" y="71" font-size="12.5" fill="#475569">the build id, and the first reproducing step. Cheap by</text><text x="72" y="88" font-size="12.5" fill="#475569">construction, so it runs at the lowest tier.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 131)"><g class="lane-label"><title>The one genuinely hard step, and the only one at the top tier — everything downstream is checking or restating its answer.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Root-cause each crash</text><text x="72" y="54" font-size="12.5" fill="#475569">The one genuinely hard step, and the only one at the</text><text x="72" y="71" font-size="12.5" fill="#475569">top tier — everything downstream is checking or</text><text x="72" y="88" font-size="12.5" fill="#475569">restating its answer.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 264)"><g class="lane-label"><title>Three lenses try to break each root cause. Demanding, but bounded by the cause already in hand, so a tier below the adjudication is enough.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Cross-examine the causes</text><text x="72" y="54" font-size="12.5" fill="#475569">Three lenses try to break each root cause.</text><text x="72" y="71" font-size="12.5" fill="#475569">Demanding, but bounded by the cause already in</text><text x="72" y="88" font-size="12.5" fill="#475569">hand, so a tier below the adjudication is enough.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 393)"><g class="lane-label"><title>Restating settled findings — a drafting job, not a reasoning one.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Write the digest</text><text x="72" y="54" font-size="12.5" fill="#475569">Restating settled findings — a drafting job, not a</text><text x="72" y="71" font-size="12.5" fill="#475569">reasoning one.</text><circle cx="76" cy="86" r="4" fill="#fef3c7" stroke="#d97706"/><text x="87" y="90" font-size="11.5" fill="#64748b">model: claude-fable-5</text></g></g><g class="topology" transform="translate(293 0)"><g class="edge"><path d="M 304 101 L 304 157" fill="no
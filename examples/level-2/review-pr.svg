<svg xmlns="http://www.w3.org/2000/svg" width="936" height="732" viewBox="0 0 936 732" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Review a pull request</title>
<desc>Review a branch&#39;s diff across independent dimensions, adversarially verify each finding, then synthesize a ranked report.</desc>
<rect width="936" height="732" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="904" height="152" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Review a pull request</text><text x="40" y="72" font-size="13.5" fill="#475569">Review a branch&#39;s diff across independent dimensions, adversarially verify each finding, then synthesize a ranked report.</text><text x="40" y="96" font-size="12.5" fill="#64748b" font-style="italic">When to use — Before merging a sizable or unfamiliar PR, when a single reviewer pass risks missing correctness, security, or performance regressions.</text><rect x="40" y="110" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="125" font-size="11" fill="#334155">4 phases</text><rect x="109" y="110" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="125" font-size="11" fill="#334155">4 agent() calls</text><rect x="203" y="110" width="70" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="125" font-size="11" fill="#334155">fan-out ×N</text></g></g>
<g transform="translate(0 180)"><rect x="16" y="0" width="904" height="536" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="108" x2="920" y2="108" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="241" x2="920" y2="241" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="366" x2="920" y2="366" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>List changed files against the base branch and group them by subsystem so each reviewer gets a focused slice.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Map the diff</text><text x="72" y="54" font-size="12.5" fill="#475569">List changed files against the base branch and group</text><text x="72" y="71" font-size="12.5" fill="#475569">them by subsystem so each reviewer gets a focused</text><text x="72" y="88" font-size="12.5" fill="#475569">slice.</text></g></g><g transform="translate(0 108)"><g class="lane-label"><title>One agent per dimension — correctness, security, performance — reviews its slice and reports findings with file:line.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Review by dimension</text><text x="72" y="54" font-size="12.5" fill="#475569">One agent per dimension — correctness, security,</text><text x="72" y="71" font-size="12.5" fill="#475569">performance — reviews its slice and reports findings</text><text x="72" y="88" font-size="12.5" fill="#475569">with file:line.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 241)"><g class="lane-label"><title>Spawn a panel of skeptics per finding, each prompted to refute it; drop anything the panel cannot defend.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Adversarially verify</text><text x="72" y="54" font-size="12.5" fill="#475569">Spawn a panel of skeptics per finding, each prompted</text><text x="72" y="71" font-size="12.5" fill="#475569">to refute it; drop anything the panel cannot defend.</text><circle cx="76" cy="86" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="90" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 366)"><g class="lane-label"><title>Dedupe the survivors, rank them by severity, and write the review with reproducible citations.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Synthesize the report</text><text x="72" y="54" font-size="12.5" fill="#475569">Dedupe the survivors, rank them by severity, and write</text><text x="72" y="71" font-size="12.5" fill="#475569">the review with reproducible citations.</text><circle cx="76" cy="86" r="4" fill="#fef3c7" stroke="#d97706"/><text x="87" y="90" font-size="11.5" fill="#64748b">model: claude-fable-5</text></g></g><g class="topology" transform="translate(352 0)"><g class="edge"><path d="M 148 190 L 148 267" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="148,267 144.7,260.5 151.3,260.5" fill="#64748b"/></g><g class="edge"><path d="M 304 130 L 154 130 Q 148 130 148 136 L 148 150" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="148,150 144.
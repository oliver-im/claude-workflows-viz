<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Review a change with two lineages</title>
<desc>Review the same diff with two independent reviewers — one Claude, one external — and merge only what both lineages agree is real, killing single-model blind spots.</desc>
<rect width="760" height="684" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="728" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Review a change with two lineages</text><text x="40" y="72" font-size="13.5" fill="#475569">Review the same diff with two independent reviewers — one Claude, one external — and merge only what both</text><text x="40" y="92" font-size="13.5" fill="#475569">lineages agree is real, killing single-model blind spots.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — Before merging a risky change, when one model&#39;s blind spots are the failure mode and a second,</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">differently-trained reviewer is cheap insurance.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">4 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">4 agent() calls</text><rect x="203" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×2</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="728" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="744" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="283" x2="744" y2="283" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Compute the cumulative diff against the base branch and split it into focus targets the reviewers can attack independently.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Scope the diff</text><text x="72" y="54" font-size="12.5" fill="#475569">Compute the cumulative diff against the base branch</text><text x="72" y="71" font-size="12.5" fill="#475569">and split it into focus targets the reviewers can attack</text><text x="72" y="88" font-size="12.5" fill="#475569">independently.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 127)"><line x1="206" y1="12" x2="206" y2="146" stroke="#e2e8f0" stroke-width="1"/><g class="lane-label"><title>A Claude reviewer reads the diff for correctness, security, and convention drift, reporting each finding with file:line and a confidence.</title><circle cx="37" cy="25" r="9" fill="#334155"/><text x="37" y="28.4" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="54" y="29" font-size="13" fill="#0f172a" font-weight="700">Claude review</text><text x="54" y="47" font-size="11" fill="#475569">A Claude reviewer reads the</text><text x="54" y="62" font-size="11" fill="#475569">diff for correctness, security,</text><text x="54" y="77" font-size="11" fill="#475569">and convention drift,</text><text x="54" y="92" font-size="11" fill="#475569">reporting each finding with</text><text x="54" y="107" font-size="11" fill="#475569">file:line and a confidence.</text><circle cx="58" cy="119" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="69" y="123" font-size="10.5" fill="#64748b">opus</text><title>model: claude-opus-5</title></g><g class="lane-label"><title>A second, non-Claude reviewer audits the same diff from scratch — its different training surfaces issues the first lineage anchors past.</title><circle cx="227" cy="25" r="9" fill="#334155"/><text x="227" y="28.4" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="244" y="29" font-size="13" fill="#0f172a" font-weight="700">External review</text><text x="244" y="47" font-size="11" fill="#475569">A second, non-Claude</text><text x="244" y="62" font-size="11" fill="#475569">reviewer audits the same</text><text x="244" y="77" font-size="11" fill="#475569">diff from scratch — its</text><text x="244" y="92" font-size="11" fill="#475569">different training surfaces</text><text x="244" y="107" font-size="11" fill="#475569">issues the first lineage</text><text x="244" y="122" font-size="11" fill="#475569">anchors past.</text><circle cx="248" cy="134" r="4" fill="#f1f5f9" stroke="#64748b"/><text x="259" y="138" font-size="10.5" fill="#64748b">gpt-5-codex</text><title>model: gpt-5-codex</title></g></g><g transform="translate(0 283)"><g class="lane-label"><title>Keep findings both lineages raise, flag the disagreements for a human, and drop what neither can defend on a second pass.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Merge the verdicts</text><text x="72" y="54" font-size="12.5" fill="#475569">Keep findings both lineages raise, flag the</text><text x="72" y="71" font-size="12.5" fill="#475569">disagreements for a human, and drop what neither</text><text x="72" y="88" font-size="12.5" fill="#475569">can defend on a second pass.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g class="topology" transform="translate(245 0)"><g class="edge"><path d="M 304 149 L 235 149 Q 229 149 229 155 L 229 169" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="229,169 225.7,162.5 232.3,162.5" fill="#64748b"/></g><g class="edge"><path d="M 304 149 L 373 149 Q 379 149 379 155 L 379 169" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="379,169 375.7,162.5 382.3,162.5" fill="#64748b"/></g><g class="edge"><path d="M 229 209 L 229 225" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 379 209 L 379 225" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 46 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 229 L 304 305" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,305 300.7,298.5 307.3,298.5" fill="#64748b"/></g><g class="agent-node"><title>Compute the diff vs main and split it into focus targets.</title><rect x="272" y="20" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="36.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="agent-node"><title>Review these targets for correctness, security, conventions:\n${JSON.stringify(…</title><rect x="175.5" y="169" width="107" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="185.5" y="185.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">review:claude</text><text x="185.5" y="199.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><title>Independently audit the same targets:\n${JSON.stringify(targets.targets)}</title><rect x="319" y="169" width="120" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.25"/><text x="329" y="185.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">review:external</text><text x="329" y="199.5" font-size="10" fill="#334155">codex agent</text></g><rect x="217" y="225" width="174" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Keep what both reviews agree on, flag the disagreements:\n${claudeFindings}\n--…</title><rect x="272" y="305" width="64" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="304" y="321.5" font-size="10" fill="#14532d" text-anchor="middle">sonnet</text></g></g><line x1="16" y1="410" x2="744" y2="410" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 423)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">haiku</text><rect x="128.02" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="145.02" y="10.8" font-size="10.5" fill="#64748b">opus</text><rect x="179.79" y="2" width="10" height="10" rx="2.5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/><text x="196.79" y="10.8" font-size="10.5" fill="#64748b">codex agent</text><rect x="266.01" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="283.01" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><text x="336.54" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="360.2" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="387.2" y="10.8" 
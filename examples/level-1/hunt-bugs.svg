<svg xmlns="http://www.w3.org/2000/svg" width="856" height="641" viewBox="0 0 856 641" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Hunt bugs until the search goes dry</title>
<desc>Repeatedly spawn finders that surface fresh bugs; keep looping while new ones appear and stop only after two rounds in a row turn up nothing new.</desc>
<rect width="856" height="641" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="824" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Hunt bugs until the search goes dry</text><text x="40" y="72" font-size="13.5" fill="#475569">Repeatedly spawn finders that surface fresh bugs; keep looping while new ones appear and stop only after two rounds in a row</text><text x="40" y="92" font-size="13.5" fill="#475569">turn up nothing new.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — For unknown-size discovery, where a fixed pass count either stops early and misses the tail or burns budget long after the</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">well has run dry.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">3 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">2 agent() calls</text><rect x="203" y="148" width="70" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×N</text><rect x="279" y="148" width="48" height="22" rx="11" fill="#f1f5f9"/><text x="288" y="163" font-size="11" fill="#334155">1 loop</text><rect x="333" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="342" y="163" font-size="11" fill="#334155">1 decision</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="824" height="407" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="155" x2="840" y2="155" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="291" x2="840" y2="291" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Each round runs finders across the codebase and dedupes their hits against everything already seen, so only genuinely new bugs count.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Find a round of bugs</text><text x="72" y="54" font-size="12.5" fill="#475569">Each round runs finders across the codebase and</text><text x="72" y="71" font-size="12.5" fill="#475569">dedupes their hits against everything already seen, so</text><text x="72" y="88" font-size="12.5" fill="#475569">only genuinely new bugs count.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 155)"><g class="lane-label"><title>Confirm each fresh bug actually reproduces, drop the false positives, and add what&#39;s left to the running ledger.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Verify and bank the survivors</text><text x="72" y="54" font-size="12.5" fill="#475569">Confirm each fresh bug actually reproduces, drop the</text><text x="72" y="71" font-size="12.5" fill="#475569">false positives, and add what&#39;s left to the running</text><text x="72" y="88" font-size="12.5" fill="#475569">ledger.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 291)"><g class="lane-label"><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Stop when the well runs dry</text></g></g><g class="topology" transform="translate(221 0)"><g class="loop-frame"><title>while dryRounds &lt; 2 &amp;&amp; (!budget.total || budget.remaining() &gt; 50_000)</title><rect x="199.5" y="20" width="395.41" height="253" rx="10" fill="#fff7ed" stroke="#e8694a" stroke-width="1.25" fill-opacity="0.7" stroke-dasharray="5 4"/><path d="M 223.78 33.31 A 4.6 4.6 0 1 1 218.59 30.49" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/><polygon points="221.53,29.9 215.81,34.42 214.5,27.95" fill="#c2410c"/><text x="229.5" y="39" font-size="11" fill="#c2410c" font-weight="700">while</text><text x="263" y="39" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">dryRounds &lt; 2 &amp;&amp; (!budget.total || budget.remai…</text></g><g class="edge"><path d="M 304 94 L 304 116" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,116 300.7,109.5 307.3,109.5" fill="#64748b"/></g><g class="edge"><path d="M 304 239 L 304 255" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 136 L 304 178" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,178 300.7,171.5 307.3,171.5" fill="#64748b"/></g><g class="edge"><path d="M 304 259 L 304 313" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,313 300.7,306.5 307.3,306.5" fill="#64748b"/></g><g class="agent-node"><title>Find bugs in the codebase.</title><rect x="272" y="68" width="64" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="304" y="84.5" font-size="10" fill="#14532d" text-anchor="middle">sonnet</text></g><g class="decision"><title>fresh.length === 0</title><polygon points="304,116 314,126 304,136 294,126" fill="#ffffff" stroke="#e8694a" stroke-width="1.5"/><text x="322" y="130" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">fresh.length === 0</text></g><g class="agent-node"><title>N from fresh</title><rect x="253.5" y="184" width="113" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><rect x="250.5" y="181" width="113" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><rect x="247.5" y="178" width="113" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="257.5" y="194.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">verify:${b.id}</text><text x="257.5" y="208.5" font-size="10" fill="#4c1d95">opus</text><rect x="340.5" y="170" width="26" height="16" rx="8" fill="#334155"/><text x="353.5" y="181.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">×N</text><text x="272.56" y="236" font-size="10" fill="#64748b">N from </text><text x="305.34" y="236" font-size="10" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">fresh</text></g><rect x="235.5" y="255" width="137" height="4" rx="2" fill="#334155" class="barrier"/><g class="control-node"><title>No agent/workflow calls were recovered in this phase.</title><circle cx="304" cy="322" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><circle cx="304" cy="322" r="5" fill="#334155"/><text x="321" y="326" font-size="11" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">end</text></g><g class="control-arc"><title>yes → continue</title><path d="M 294 126 L 217.5 126 Q 211.5 126 211.5 120 L 211.5 63 Q 211.5 57 217.5 57 L 298.5 57 Q 304 57 304 62.5 L 304 68" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="304,68 300.7,61.5 307.3,61.5" fill="#e8694a"/><text x="288" y="139" font-size="10.5" fill="#c2410c" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">yes</text></g></g><line x1="16" y1="347" x2="840" y2="347" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 360)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">opus</text><text x="196.22" y="10.8" font-size="10.5" fill="#475569" font-weight="700">×N</text><rect x="218.93" y="4" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="216.93" y="2" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="214.93" y="0" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="239.93" y="10.8" font-size="10.5" fill="#64748b">one per item, counted at run time</text><text x="416.02" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="439.68" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="466.68" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><polygon points="547.2,1 553.2,7 547.2,13 541.2,7" fill="#ffffff" stroke="#e8694a" stroke-width="1.2"/><text x="558.2" y="10.8" font-size="10.5" fill="#64748b">decision</text><text x="618.73" y="10.8" font-size="10.5" fill="#475569" font-weight="700">loop</text><rect x="645.88" y="1" width="18" height="12" rx="3" fill="#fff7ed" stroke="#e8694a" stroke-width="1" fill-opacity="0.7" stroke-dasharray="3 2"/><text x="668.88" y="10.8" font-size="10.5" fill="#64748b">repeats the framed body</text><text x="38" y="30.8" font-size="10.5" fill="#475569" font-weight="700">continue</text><path d="M 86.75 27 L 98.75 27" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="104.75,27 98.25,30.3 98.25,23.7" fill="#e8694a"/><text x="109.75" y="30.8" font-size="10.5" fill="#64748b">loop again from the top</text><circle cx="245.16" cy="27" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><circle cx="245.16" cy="27" r="3" fill="#334155"/><text x="256.16" y="30.8" font-size="10.5" fill="#64748b">workflow ends</text></g></g>
</svg>

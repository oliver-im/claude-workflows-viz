<svg xmlns="http://www.w3.org/2000/svg" width="976" height="557" viewBox="0 0 976 557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="976" height="557" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="944" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="48" font-size="22" fill="#0f172a" font-weight="700">Hunt bugs until the search goes dry</text><text x="38" y="77" font-size="13.5" fill="#475569">Repeatedly spawn finders that surface fresh bugs; keep looping while new ones appear and stop only after two</text><text x="38" y="96" font-size="13.5" fill="#475569">rounds in a row turn up nothing new.</text><text x="38" y="125" font-size="12.5" fill="#64748b" font-style="italic">When to use — For unknown-size discovery, where a fixed pass count either stops early and misses the tail or burns budget</text><text x="38" y="142" font-size="12.5" fill="#64748b" font-style="italic">long after the well has run dry.</text></g></g>
<g transform="translate(0 192)"><rect x="16" y="0" width="944" height="349" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="136" x2="960" y2="136" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="267" x2="960" y2="267" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Each round runs finders across the codebase and dedupes their hits against everything already seen, so only genuinely new bugs count.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Find a round of bugs</text><text x="72" y="54" font-size="12.5" fill="#475569">Each round runs finders across the codebase and</text><text x="72" y="71" font-size="12.5" fill="#475569">dedupes their hits against everything already</text><text x="72" y="88" font-size="12.5" fill="#475569">seen, so only genuinely new bugs count.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 136)"><g class="lane-label"><title>Confirm each fresh bug actually reproduces, drop the false positives, and add what&#39;s left to the running ledger.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Verify and bank the survivors</text><text x="72" y="54" font-size="12.5" fill="#475569">Confirm each fresh bug actually reproduces,</text><text x="72" y="71" font-size="12.5" fill="#475569">drop the false positives, and add what&#39;s left</text><text x="72" y="88" font-size="12.5" fill="#475569">to the running ledger.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 267)"><g class="lane-label"><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Stop when the well runs dry</text><circle cx="76" cy="49" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="87" y="53" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(207 0)"><g class="edge"><path d="M 304 64 L 304 98" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,98 300.5,91 307.5,91" fill="#64748b"/></g><g class="edge"><path d="M 304 120 L 304 178" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,178 300.5,171 307.5,171" fill="#64748b"/></g><g class="edge"><path d="M 304 204 L 304 307" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,307 300.5,300 307.5,300" fill="#64748b"/></g><g class="agent-node"><title>Find bugs in the codebase.</title><circle cx="304" cy="51" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><g class="decision"><title>fresh.length === 0</title><polygon points="304,98 315,109 304,120 293,109" fill="#ffffff" stroke="#e8694a" stroke-width="1.4"/><text x="321" y="113" font-size="11" fill="#94a3b8" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">fresh.length === 0</text></g><g class="agent-node"><circle cx="306" cy="193" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="304" cy="191" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="325" y="195" font-size="12.5" fill="#334155" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">verify each fresh</text><text x="318" y="180" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="control-node"><title>No agent/workflow calls were recovered in this phase.</title><rect class="control-box" x="256" y="307" width="96" height="30" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="4 3"/><text x="304" y="326" font-size="12" fill="#9a3412" font-weight="600" text-anchor="middle">end</text></g><g class="control-arc"><path d="M 297.95 113.95 C 276 109 276 51 289 51" fill="none" stroke="#e8694a" stroke-width="1.4"/><polygon points="289,51 282,54.5 282,47.5" fill="#e8694a"/><text x="274" y="112.5" font-size="11" fill="#94a3b8" font-style="italic" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">yes</text></g><g class="loop-badge"><title>repeat while dryRounds &lt; 2 &amp;&amp; (!budget.total || budget.remaining() &gt; 50_000)</title><text x="325" y="70" font-size="11" fill="#e8694a" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">↻ repeat while dryRounds &lt; 2 &amp;&amp; (!budget.total || budget.remai…</text></g></g></g>
</svg>

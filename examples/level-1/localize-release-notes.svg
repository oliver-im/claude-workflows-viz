<svg xmlns="http://www.w3.org/2000/svg" width="910" height="654" viewBox="0 0 910 654" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="910" height="654" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="878" height="183" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="48" font-size="22" fill="#0f172a" font-weight="700">Localize the release notes</text><text x="38" y="77" font-size="13.5" fill="#475569">Map each target locale through its own translate-then-proofread pipeline — no barrier between the stages,</text><text x="38" y="96" font-size="13.5" fill="#475569">so a fast locale ships while a slow one is still translating — then reduce the finished files into one</text><text x="38" y="115" font-size="13.5" fill="#475569">pull request.</text><text x="38" y="144" font-size="12.5" fill="#64748b" font-style="italic">When to use — For per-item work that fans wide and stages deep — translation, codemods, asset processing — where</text><text x="38" y="161" font-size="12.5" fill="#64748b" font-style="italic">the slowest single item, not the slowest stage, should set the wall-clock.</text></g></g>
<g transform="translate(0 211)"><rect x="16" y="0" width="878" height="427" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="132" x2="894" y2="132" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="283" x2="894" y2="283" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>One translator per locale drafts the notes and writes its file in its own worktree, so the parallel writes never collide on disk.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Translate each locale</text><text x="72" y="54" font-size="12.5" fill="#475569">One translator per locale drafts the notes and</text><text x="72" y="71" font-size="12.5" fill="#475569">writes its file in its own worktree, so the</text><text x="72" y="88" font-size="12.5" fill="#475569">parallel writes never collide on disk.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 132)"><g class="lane-label"><title>Back-translate to catch drift and lint each file as it lands; with no barrier between stages, a finished locale advances here while others are still translating.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Proofread each translation</text><text x="72" y="54" font-size="12.5" fill="#475569">Back-translate to catch drift and lint each</text><text x="72" y="71" font-size="12.5" fill="#475569">file as it lands; with no barrier between</text><text x="72" y="88" font-size="12.5" fill="#475569">stages, a finished locale advances here while</text><text x="72" y="105" font-size="12.5" fill="#475569">others are still translating.</text><circle cx="76" cy="120" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 283)"><g class="lane-label"><title>Once every locale&#39;s file lands, a shared open-a-PR sub-workflow collates them into a single pull request with a per-locale summary of what changed.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Reduce into one PR</text><text x="72" y="54" font-size="12.5" fill="#475569">Once every locale&#39;s file lands, a shared</text><text x="72" y="71" font-size="12.5" fill="#475569">open-a-PR sub-workflow collates them into a</text><text x="72" y="88" font-size="12.5" fill="#475569">single pull request with a per-locale summary</text><text x="72" y="105" font-size="12.5" fill="#475569">of what changed.</text><circle cx="76" cy="120" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(361 0)"><g class="edge"><path d="M 139.45 87 L 139.45 177" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="139.45,177 135.95,170 142.95,170" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 139.45 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="139.45,61 146.08,56.84 146.76,63.81" fill="#64748b"/></g><g class="edge"><path d="M 249.15 87 L 249.15 177" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="249.15,177 245.65,170 252.65,170" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 249.15 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="249.15,61 254.89,55.68 256.85,62.4" fill="#64748b"/></g><g class="edge"><path d="M 358.85 87 L 358.85 177" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="358.85,177 355.35,170 362.35,170" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 358.85 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="358.85,61 351.15,62.4 353.11,55.68" fill="#64748b"/></g><g class="edge"><path d="M 468.55 87 L 468.55 177" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="468.55,177 465.05,170 472.05,170" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 468.55 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="468.55,61 461.24,63.81 461.92,56.84" fill="#64748b"/></g><g class="edge"><path d="M 139.45 203 L 304 240" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 249.15 203 L 304 240" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 358.85 203 L 304 240" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 468.55 203 L 304 240" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 247 L 304 323" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,323 300.5,316 307.5,316" fill="#64748b"/></g><circle class="hub" cx="304" cy="41.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="139.45" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="139.45" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">translate:de</text></g><g class="agent-node"><circle cx="139.45" cy="190" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="139.45" y="215" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">proofread</text></g><g class="agent-node"><circle cx="249.15" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="249.15" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">translate:ja</text></g><g class="agent-node"><circle cx="249.15" cy="190" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="249.15" y="215" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">proofread</text></g><g class="agent-node"><circle cx="358.85" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="358.85" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">translate:pt-BR</text></g><g class="agent-node"><circle cx="358.85" cy="190" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="358.85" y="215" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">proofread</text></g><g class="agent-node"><circle cx="468.55" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="468.55" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">translate:fr</text></g><g class="agent-node"><circle cx="468.55" cy="190" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="468.55" y="215" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">proofread</text></g><circle class="hub" cx="304" cy="243.5" r="3.5" fill="#94a3b8"/><g class="task-node"><rect x="222" y="323" width="164" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="304" y="342" font-size="12" fill="#334155" text-anchor="middle">open-localization-pr</text></g></g></g>
</svg>

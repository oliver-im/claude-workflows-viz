<svg xmlns="http://www.w3.org/2000/svg" width="988" height="646" viewBox="0 0 988 646" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Localize the release notes</title>
<desc>Map each target locale through its own translate-then-proofread pipeline — no barrier between the stages, so a fast locale ships while a slow one is still translating — then reduce the finished files into one pull request.</desc>
<rect width="988" height="646" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="956" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Localize the release notes</text><text x="40" y="72" font-size="13.5" fill="#475569">Map each target locale through its own translate-then-proofread pipeline — no barrier between the stages, so a fast locale ships while a slow one is still</text><text x="40" y="92" font-size="13.5" fill="#475569">translating — then reduce the finished files into one pull request.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — For per-item work that fans wide and stages deep — translation, codemods, asset processing — where the slowest single item, not the slowest</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">stage, should set the wall-clock.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">3 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">2 agent() calls</text><rect x="203" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×4</text><rect x="277" y="148" width="92" height="22" rx="11" fill="#f1f5f9"/><text x="286" y="163" font-size="11" fill="#334155">1 sub-workflow</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="956" height="412" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="131" x2="972" y2="131" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="264" x2="972" y2="264" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>One translator per locale drafts the notes and writes its file in its own worktree, so the parallel writes never collide on disk.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Translate each locale</text><text x="72" y="54" font-size="12.5" fill="#475569">One translator per locale drafts the notes and writes</text><text x="72" y="71" font-size="12.5" fill="#475569">its file in its own worktree, so the parallel writes never</text><text x="72" y="88" font-size="12.5" fill="#475569">collide on disk.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 131)"><g class="lane-label"><title>Back-translate to catch drift and lint each file as it lands; with no barrier between stages, a finished locale advances here while others are still translating.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Proofread each translation</text><text x="72" y="54" font-size="12.5" fill="#475569">Back-translate to catch drift and lint each file as it</text><text x="72" y="71" font-size="12.5" fill="#475569">lands; with no barrier between stages, a finished</text><text x="72" y="88" font-size="12.5" fill="#475569">locale advances here while others are still translating.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 264)"><g class="lane-label"><title>Once every locale&#39;s file lands, a shared open-a-PR sub-workflow collates them into a single pull request with a per-locale summary of what changed.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Reduce into one PR</text><text x="72" y="54" font-size="12.5" fill="#475569">Once every locale&#39;s file lands, a shared open-a-PR</text><text x="72" y="71" font-size="12.5" fill="#475569">sub-workflow collates them into a single pull request</text><text x="72" y="88" font-size="12.5" fill="#475569">with a per-locale summary of what changed.</text></g></g><g class="topology" transform="translate(380 0)"><g class="edge"><path d="M 100 80 L 100 157" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="100,157 96.7,150.5 103.3,150.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 106 20 Q 100 20 100 26 L 100 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="100,40 96.7,33.5 103.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 236 80 L 236 157" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="236,157 232.7,150.5 239.3,150.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 242 20 Q 236 20 236 26 L 236 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="236,40 232.7,33.5 239.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 372 80 L 372 157" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="372,157 368.7,150.5 375.3,150.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 366 20 Q 372 20 372 26 L 372 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="372,40 368.7,33.5 375.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 508 80 L 508 157" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="508,157 504.7,150.5 511.3,150.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 502 20 Q 508 20 508 26 L 508 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="508,40 504.7,33.5 511.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 100 197 L 100 213" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 236 197 L 236 213" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 372 197 L 372 213" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 508 197 L 508 213" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 217 L 304 286" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,286 300.7,279.5 307.3,279.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="40" y="40" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="50" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">translate:de</text><text x="50" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="40" y="157" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="50" y="173.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">proofread</text><text x="50" y="187.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="176" y="40" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="186" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">translate:ja</text><text x="186" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="176" y="157" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="186" y="173.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">proofread</text><text x="186" y="187.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="312" y="40" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="322" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">translate:pt-BR</text><text x="322" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="312" y="157" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="322" y="173.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">proofread</text><text x="322" y="187.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="448" y="40" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="458" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">translate:fr</text><text x="458" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="448" y="157" width="120" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="458" y="173.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">proofread</text><text x="458" y="187.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="88" y="213" width="432" height="4" rx="2" fill="#334155" class="barrier"/><g class="task-node"><rect x="223.5" y="286" width="161" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.25"/><line x1="229.5" y1="291" x2="229.5" y2="321" stroke="#334155" stroke-width="1.25"/><text x="241.5" y="302.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">open-localization-pr</text><text x="241.5" y="316.5" font-size="10" fill="#64748b">sub-workflow</text></g></g><line x1="16" y1="372" x2="972" y2="372" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 385)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><text x="144.45" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="168.11" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="195.11" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><rect x="269.63" y="1" width="16" height="12" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/><line x1="273.13" y1="3" x2="273.13" y2="11" stroke="#334155"/><text x="290.63" y="10.8" font-size="10.5" fill="#64748b">sub-workflow</text><circle cx="378.89" cy="7" r="4" fill="#334155"/><text x="388.89" y="10.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="912" height="657" viewBox="0 0 912 657" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Draft a launch announcement</title>
<desc>Draft the same announcement from several independent angles, score every draft against a panel of judges each applying one rubric lens, then synthesize the winner and graft in the best lines from the runners-up.</desc>
<rect width="912" height="657" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="880" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Draft a launch announcement</text><text x="40" y="72" font-size="13.5" fill="#475569">Draft the same announcement from several independent angles, score every draft against a panel of judges each applying one rubric lens,</text><text x="40" y="92" font-size="13.5" fill="#475569">then synthesize the winner and graft in the best lines from the runners-up.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the solution space is wide and one draft iterated rarely beats several independent attempts judged in parallel — and the best</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">version borrows a line or two from the ones it beat.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">3 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×3</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="880" height="423" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="896" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="256" x2="896" y2="256" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Spin up one writer per angle — MVP-first, risk-first, user-first — each producing a full self-contained draft, not a variation on a single shared outline.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft from each angle</text><text x="72" y="54" font-size="12.5" fill="#475569">Spin up one writer per angle — MVP-first, risk-first,</text><text x="72" y="71" font-size="12.5" fill="#475569">user-first — each producing a full self-contained draft,</text><text x="72" y="88" font-size="12.5" fill="#475569">not a variation on a single shared outline.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>A panel of judges scores all drafts at once, each judge ranking them on one rubric lens — clarity, credibility, memorability — so no single taste decides the winner.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Score on the panel</text><text x="72" y="54" font-size="12.5" fill="#475569">A panel of judges scores all drafts at once, each judge</text><text x="72" y="71" font-size="12.5" fill="#475569">ranking them on one rubric lens — clarity, credibility,</text><text x="72" y="88" font-size="12.5" fill="#475569">memorability — so no single taste decides the winner.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 256)"><g class="lane-label"><title>Take the panel&#39;s top-ranked draft and graft in the strongest lines from the runners-up, producing one version better than any single attempt.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Synthesize the winner</text><text x="72" y="54" font-size="12.5" fill="#475569">Take the panel&#39;s top-ranked draft and graft in the</text><text x="72" y="71" font-size="12.5" fill="#475569">strongest lines from the runners-up, producing one</text><text x="72" y="88" font-size="12.5" fill="#475569">version better than any single attempt.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g class="topology" transform="translate(342 0)"><g class="edge"><path d="M 304 20 L 168 20 Q 162 20 162 26 L 162 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="162,40 158.7,33.5 165.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 304 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,40 300.7,33.5 307.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 440 20 Q 446 20 446 26 L 446 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="446,40 442.7,33.5 449.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 162 80 L 162 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 80 L 304 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 446 80 L 446 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 149 L 154 149 Q 148 149 148 155 L 148 169" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="148,169 144.7,162.5 151.3,162.5" fill="#64748b"/></g><g class="edge"><path d="M 304 149 L 304 169" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,169 300.7,162.5 307.3,162.5" fill="#64748b"/></g><g class="edge"><path d="M 304 149 L 454 149 Q 460 149 460 155 L 460 169" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="460,169 456.7,162.5 463.3,162.5" fill="#64748b"/></g><g class="edge"><path d="M 148 209 L 148 225" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 209 L 304 225" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 460 209 L 460 225" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 100 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 229 L 304 278" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,278 300.7,271.5 307.3,271.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="99" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="109" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:MVP-first</text><text x="109" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="241" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="251" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:risk-first</text><text x="251" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="383" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="393" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:user-first</text><text x="393" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="150" y="96" width="308" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><rect x="78" y="169" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="88" y="185.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">judge:clarity</text><text x="88" y="199.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><rect x="234" y="169" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="244" y="185.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">judge:credibility</text><text x="244" y="199.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><rect x="390" y="169" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="400" y="185.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">judge:memorability</text><text x="400" y="199.5" font-size="10" fill="#4c1d95">opus</text></g><rect x="136" y="225" width="336" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Take the panel&#39;s top draft and graft in the best lines from the runners-up:\n${…</title><rect x="272" y="278" width="64" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="304" y="294.5" font-size="10" fill="#14532d" text-anchor="middle">sonnet</text></g></g><line x1="16" y1="383" x2="896" y2="383" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 396)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">opus</text><text x="196.22" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="219.88" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="246.88" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><circle cx="326.4" cy="7" r="4" fill="#334155"/><text x="336.4" y="10.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>
</svg>

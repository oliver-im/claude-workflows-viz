<svg xmlns="http://www.w3.org/2000/svg" width="760" height="657" viewBox="0 0 760 657" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Summarize an unfamiliar codebase</title>
<desc>Fan out one reader per top-level module, each summarizing its slice in isolation, then synthesize the slices into a single architecture overview.</desc>
<rect width="760" height="657" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="728" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Summarize an unfamiliar codebase</text><text x="40" y="72" font-size="13.5" fill="#475569">Fan out one reader per top-level module, each summarizing its slice in isolation, then synthesize the slices into a</text><text x="40" y="92" font-size="13.5" fill="#475569">single architecture overview.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — On first contact with a large repo no single context can hold, when each module still fits comfortably on its</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">own for a focused reader.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">3 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="148" width="70" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×N</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="728" height="423" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="744" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="256" x2="744" y2="256" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Walk the top-level directories and package manifests to build the work-list — one reader per module, nothing read in depth yet.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">List the modules</text><text x="72" y="54" font-size="12.5" fill="#475569">Walk the top-level directories and package manifests</text><text x="72" y="71" font-size="12.5" fill="#475569">to build the work-list — one reader per module,</text><text x="72" y="88" font-size="12.5" fill="#475569">nothing read in depth yet.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>Each reader summarizes its module&#39;s purpose, public surface, and key dependencies, blind to the others so they all run at once.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Read every module in parallel</text><text x="72" y="54" font-size="12.5" fill="#475569">Each reader summarizes its module&#39;s purpose, public</text><text x="72" y="71" font-size="12.5" fill="#475569">surface, and key dependencies, blind to the others so</text><text x="72" y="88" font-size="12.5" fill="#475569">they all run at once.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 256)"><g class="lane-label"><title>Merge the per-module summaries into one architecture doc: a dependency sketch, the real entry points, and where a newcomer should start.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Synthesize the overview</text><text x="72" y="54" font-size="12.5" fill="#475569">Merge the per-module summaries into one</text><text x="72" y="71" font-size="12.5" fill="#475569">architecture doc: a dependency sketch, the real entry</text><text x="72" y="88" font-size="12.5" fill="#475569">points, and where a newcomer should start.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g class="topology" transform="translate(190 0)"><g class="edge"><path d="M 304 210 L 304 226" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 46 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,149 300.7,142.5 307.3,142.5" fill="#64748b"/></g><g class="edge"><path d="M 304 230 L 304 278" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,278 300.7,271.5 307.3,271.5" fill="#64748b"/></g><g class="agent-node"><title>List top-level modules with a one-line guess at each one&#39;s job.</title><rect x="272" y="20" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="36.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="agent-node"><title>N from modules.modules</title><rect x="248" y="155" width="124" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="245" y="152" width="124" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="242" y="149" width="124" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="252" y="165.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">read:${m}</text><text x="252" y="179.5" font-size="10" fill="#14532d">sonnet</text><rect x="346" y="141" width="26" height="16" rx="8" fill="#334155"/><text x="359" y="152.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">×N</text><text x="242.45" y="207" font-size="10" fill="#64748b">N from </text><text x="275.23" y="207" font-size="10" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">modules.modules</text></g><rect x="230" y="226" width="148" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Write one architecture overview from these module summaries:\n${JSON.stringify(…</title><rect x="272" y="278" width="64" height="26" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="304" y="294.5" font-size="10" fill="#4c1d95" text-anchor="middle">opus</text></g></g><line x1="16" y1="383" x2="744" y2="383" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 396)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">haiku</text><rect x="128.02" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="145.02" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="188.55" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="205.55" y="10.8" font-size="10.5" fill="#64748b">opus</text><text x="250.32" y="10.8" font-size="10.5" fill="#475569" font-weight="700">×N</text><rect x="273.04" y="4" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="271.04" y="2" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="269.04" y="0" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="294.04" y="10.8" font-size="10.5" fill="#64748b">one per item, counted at run time</text><text x="470.13" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="493.79" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="520.79" y="10.8" font-size="10.5" fill="#64748b">waits for all</text></g></g>
</svg>

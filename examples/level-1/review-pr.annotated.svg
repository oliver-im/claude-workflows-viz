"#ffffff"/><text x="175.16" y="228" font-size="11" fill="#334155" text-anchor="middle">review:correctness</text></g><g class="agent-node"><circle cx="177.16" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="175.16" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="117.93" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="175.16" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="189.16" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="agent-node"><circle cx="304" cy="203" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="253.15" y="217.7" width="101.7" height="14" fill="#ffffff"/><text x="304" y="228" font-size="11" fill="#334155" text-anchor="middle">review:security</text></g><g class="agent-node"><circle cx="306" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="304" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="246.77" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="304" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="318" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="agent-node"><circle cx="432.84" cy="203" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="372.42" y="217.7" width="120.84" height="14" fill="#ffffff"/><text x="432.84" y="228" font-size="11" fill="#334155" text-anchor="middle">review:performance</text></g><g class="agent-node"><circle cx="434.84" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="432.84" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="375.61" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="432.84" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="446.84" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><circle class="hub" cx="304" cy="372.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><title>Write a ranked review of: ${JSON.stringify(confirmed)}</title><circle cx="304" cy="448" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g></g></g>

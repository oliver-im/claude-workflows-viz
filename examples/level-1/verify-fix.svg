<svg xmlns="http://www.w3.org/2000/svg" width="912" height="767" viewBox="0 0 912 767" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Adversarially verify a fix</title>
<desc>One worker proposes the smallest patch that makes a failing test pass; a panel of skeptics each tries to refute it, and it ships only if they can&#39;t.</desc>
<rect width="912" height="767" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="880" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Adversarially verify a fix</text><text x="40" y="72" font-size="13.5" fill="#475569">One worker proposes the smallest patch that makes a failing test pass; a panel of skeptics each tries to refute it, and it ships only if they</text><text x="40" y="92" font-size="13.5" fill="#475569">can&#39;t.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — For a fix in a high-blast-radius area, where a plausible patch that merely silences the symptom is more dangerous than leaving the</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">bug open.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">4 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×3</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="880" height="533" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="896" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="256" x2="896" y2="256" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="385" x2="896" y2="385" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Confirm the bug reproduces from a clean checkout and capture the exact failing assertion as the ground truth every skeptic must respect.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Reproduce the failure</text><text x="72" y="54" font-size="12.5" fill="#475569">Confirm the bug reproduces from a clean checkout</text><text x="72" y="71" font-size="12.5" fill="#475569">and capture the exact failing assertion as the ground</text><text x="72" y="88" font-size="12.5" fill="#475569">truth every skeptic must respect.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>Find the root cause and write the smallest patch (ideally &lt; 20 lines) that turns the test green without weakening the assertion.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Propose a minimal patch</text><text x="72" y="54" font-size="12.5" fill="#475569">Find the root cause and write the smallest patch</text><text x="72" y="71" font-size="12.5" fill="#475569">(ideally &lt; 20 lines) that turns the test green without</text><text x="72" y="88" font-size="12.5" fill="#475569">weakening the assertion.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 256)"><g class="lane-label"><title>Spawn skeptics on distinct lenses — correctness, security, regressions — each told to break the patch and to default to rejecting it.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Refute in parallel</text><text x="72" y="54" font-size="12.5" fill="#475569">Spawn skeptics on distinct lenses — correctness,</text><text x="72" y="71" font-size="12.5" fill="#475569">security, regressions — each told to break the patch</text><text x="72" y="88" font-size="12.5" fill="#475569">and to default to rejecting it.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 385)"><g class="lane-label"><title>Ship only if a majority of skeptics fail to refute; otherwise bounce the patch back with their strongest counter-example attached.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Ship or bounce</text><text x="72" y="54" font-size="12.5" fill="#475569">Ship only if a majority of skeptics fail to refute;</text><text x="72" y="71" font-size="12.5" fill="#475569">otherwise bounce the patch back with their strongest</text><text x="72" y="88" font-size="12.5" fill="#475569">counter-example attached.</text></g></g><g class="topology" transform="translate(342 0)"><g class="edge"><path d="M 304 46 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,149 300.7,142.5 307.3,142.5" fill="#64748b"/></g><g class="edge"><path d="M 304 278 L 154 278 Q 148 278 148 284 L 148 298" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="148,298 144.7,291.5 151.3,291.5" fill="#64748b"/></g><g class="edge"><path d="M 304 278 L 304 298" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,298 300.7,291.5 307.3,291.5" fill="#64748b"/></g><g class="edge"><path d="M 304 278 L 454 278 Q 460 278 460 284 L 460 298" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="460,298 456.7,291.5 463.3,291.5" fill="#64748b"/></g><g class="edge"><path d="M 148 338 L 148 354" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 338 L 304 354" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 460 338 L 460 354" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 175 L 304 278" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 358 L 304 407" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,407 300.7,400.5 307.3,400.5" fill="#64748b"/></g><g class="agent-node"><title>Reproduce the bug from a clean checkout; quote the failing assertion.</title><rect x="272" y="20" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="36.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="agent-node"><title>Write the smallest patch that fixes:\n${failing}</title><rect x="272" y="149" width="64" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="304" y="165.5" font-size="10" fill="#14532d" text-anchor="middle">sonnet</text></g><g class="agent-node"><rect x="78" y="298" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="88" y="314.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">refute:correctness</text><text x="88" y="328.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><rect x="234" y="298" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="244" y="314.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">refute:security</text><text x="244" y="328.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><rect x="390" y="298" width="140" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="400" y="314.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">refute:regressions</text><text x="400" y="328.5" font-size="10" fill="#4c1d95">opus</text></g><rect x="136" y="354" width="336" height="4" rx="2" fill="#334155" class="barrier"/><g class="control-node"><title>No agent/workflow calls were recovered in this phase.</title><circle cx="304" cy="416" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><circle cx="304" cy="416" r="5" fill="#334155"/><text x="321" y="420" font-size="11" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">end</text></g></g><line x1="16" y1="493" x2="896" y2="493" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 506)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">haiku</text><rect x="128.02" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="145.02" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="188.55" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="205.55" y="10.8" font-size="10.5" fill="#64748b">opus</text><text x="250.32" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="273.98" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="300.98" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><circle cx="381.5" cy="7" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><circle cx="381.5" cy="7" r="3" fill="#334155"/><text x="392.5" y="10.8" font-size="10.5" fill="#64748b">workflow ends</text></g></g>
</svg>

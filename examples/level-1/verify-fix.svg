<svg xmlns="http://www.w3.org/2000/svg" width="877" height="766.5" viewBox="0 0 877 766.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="877" height="766.5" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="845" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="48" font-size="22" fill="#0f172a" font-weight="700">Adversarially verify a fix</text><text x="38" y="77" font-size="13.5" fill="#475569">One worker proposes the smallest patch that makes a failing test pass; a panel of skeptics each tries</text><text x="38" y="96" font-size="13.5" fill="#475569">to refute it, and it ships only if they can&#39;t.</text><text x="38" y="125" font-size="12.5" fill="#64748b" font-style="italic">When to use — For a fix in a high-blast-radius area, where a plausible patch that merely silences the symptom</text><text x="38" y="142" font-size="12.5" fill="#64748b" font-style="italic">is more dangerous than leaving the bug open.</text></g></g>
<g transform="translate(0 192)"><rect x="16" y="0" width="845" height="558.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="144" x2="861" y2="144" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="273" x2="861" y2="273" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="431.5" x2="861" y2="431.5" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Confirm the bug reproduces from a clean checkout and capture the exact failing assertion as the ground truth every skeptic must respect.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Reproduce the failure</text><text x="72" y="54" font-size="12.5" fill="#475569">Confirm the bug reproduces from a clean</text><text x="72" y="71" font-size="12.5" fill="#475569">checkout and capture the exact failing</text><text x="72" y="88" font-size="12.5" fill="#475569">assertion as the ground truth every skeptic</text><text x="72" y="105" font-size="12.5" fill="#475569">must respect.</text><circle cx="76" cy="120" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 144)"><g class="lane-label"><title>Find the root cause and write the smallest patch (ideally &lt; 20 lines) that turns the test green without weakening the assertion.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Propose a minimal patch</text><text x="72" y="54" font-size="12.5" fill="#475569">Find the root cause and write the smallest</text><text x="72" y="71" font-size="12.5" fill="#475569">patch (ideally &lt; 20 lines) that turns the test</text><text x="72" y="88" font-size="12.5" fill="#475569">green without weakening the assertion.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 273)"><g class="lane-label"><title>Spawn skeptics on distinct lenses — correctness, security, regressions — each told to break the patch and to default to rejecting it.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Refute in parallel</text><text x="72" y="54" font-size="12.5" fill="#475569">Spawn skeptics on distinct lenses —</text><text x="72" y="71" font-size="12.5" fill="#475569">correctness, security, regressions — each told</text><text x="72" y="88" font-size="12.5" fill="#475569">to break the patch and to default to rejecting</text><text x="72" y="105" font-size="12.5" fill="#475569">it.</text><circle cx="76" cy="120" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 431.5)"><g class="lane-label"><title>Ship only if a majority of skeptics fail to refute; otherwise bounce the patch back with their strongest counter-example attached.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Ship or bounce</text><text x="72" y="54" font-size="12.5" fill="#475569">Ship only if a majority of skeptics fail to</text><text x="72" y="71" font-size="12.5" fill="#475569">refute; otherwise bounce the patch back with</text><text x="72" y="88" font-size="12.5" fill="#475569">their strongest counter-example attached.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g class="topology" transform="translate(344 0)"><g class="edge"><path d="M 304 64 L 304 184" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,184 300.5,177 307.5,177" fill="#64748b"/></g><g class="edge"><path d="M 304 320 L 175.16 336" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="175.16,336 181.68,331.66 182.54,338.61" fill="#64748b"/></g><g class="edge"><path d="M 304 320 L 304 336" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="304,336 300.5,329 307.5,329" fill="#64748b"/></g><g class="edge"><path d="M 304 320 L 432.84 336" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="432.84,336 425.46,338.61 426.32,331.66" fill="#64748b"/></g><g class="edge"><path d="M 175.16 362 L 175.16 387.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 362 L 304 387.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 432.84 362 L 432.84 387.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 394.5 L 304 410.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,410.5 300.5,403.5 307.5,403.5" fill="#64748b"/></g><g class="edge"><path d="M 304 210 L 304 313" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,313 300.5,306 307.5,306" fill="#64748b"/></g><g class="edge"><path d="M 304 417.5 L 304 471.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,471.5 300.5,464.5 307.5,464.5" fill="#64748b"/></g><g class="agent-node"><title>Reproduce the bug from a clean checkout; quote the failing assertion.</title><circle cx="304" cy="51" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><g class="agent-node"><title>Write the smallest patch that fixes:\n${failing}</title><circle cx="304" cy="197" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><circle class="hub" cx="304" cy="316.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="175.16" cy="349" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="175.16" y="374" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:correctness</text></g><g class="agent-node"><circle cx="304" cy="349" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="304" y="374" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:security</text></g><g class="agent-node"><circle cx="432.84" cy="349" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="432.84" y="374" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">refute:regressions</text></g><rect class="barrier" x="162.16" y="387.5" width="283.68" height="7" rx="3.5" fill="#e8694a"/><circle class="hub" cx="304" cy="414" r="3.5" fill="#94a3b8"/><g class="control-node"><title>No agent/workflow calls were recovered in this phase.</title><rect class="control-box" x="256" y="471.5" width="96" height="30" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="4 3"/><text x="304" y="490.5" font-size="12" fill="#9a3412" font-weight="600" text-anchor="middle">end</text></g></g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="870" height="615" viewBox="0 0 870 615" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Name a new feature</title>
<desc>Several generators each pitch a batch of candidate names; one filter scores them for clarity &amp; memorability, dedupes near-collisions, and keeps the best.</desc>
<rect width="870" height="615" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="838" height="148" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Name a new feature</text><text x="40" y="72" font-size="13.5" fill="#475569">Several generators each pitch a batch of candidate names; one filter scores them for clarity &amp; memorability, dedupes</text><text x="40" y="92" font-size="13.5" fill="#475569">near-collisions, and keeps the best.</text><rect x="40" y="106" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="121" font-size="11" fill="#334155">3 phases</text><rect x="109" y="106" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="121" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="106" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="121" font-size="11" fill="#334155">fan-out ×3</text></g></g>
<g transform="translate(0 176)"><rect x="16" y="0" width="838" height="423" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="854" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="256" x2="854" y2="256" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Run generators with different framings — literal, playful, metaphorical — so the pool is genuinely diverse, not variations on one idea.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Generate candidates</text><text x="72" y="54" font-size="12.5" fill="#475569">Run generators with different framings — literal,</text><text x="72" y="71" font-size="12.5" fill="#475569">playful, metaphorical — so the pool is genuinely</text><text x="72" y="88" font-size="12.5" fill="#475569">diverse, not variations on one idea.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>Score every name on clarity, memorability, and availability, collapse near-duplicates, and discard everything below the bar.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Filter by rubric and dedupe</text><text x="72" y="54" font-size="12.5" fill="#475569">Score every name on clarity, memorability, and</text><text x="72" y="71" font-size="12.5" fill="#475569">availability, collapse near-duplicates, and discard</text><text x="72" y="88" font-size="12.5" fill="#475569">everything below the bar.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 256)"><g class="lane-label"><title>Return the top handful with a one-line rationale each, plus the strongest candidate that was cut and why it lost.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Shortlist the best</text><text x="72" y="54" font-size="12.5" fill="#475569">Return the top handful with a one-line rationale each,</text><text x="72" y="71" font-size="12.5" fill="#475569">plus the strongest candidate that was cut and why it</text><text x="72" y="88" font-size="12.5" fill="#475569">lost.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(321 0)"><g class="edge"><path d="M 304 20 L 168 20 Q 162 20 162 26 L 162 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="162,40 158.7,33.5 165.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 304 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,40 300.7,33.5 307.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 440 20 Q 446 20 446 26 L 446 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="446,40 442.7,33.5 449.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 162 80 L 162 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 80 L 304 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 446 80 L 446 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 100 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,149 300.7,142.5 307.3,142.5" fill="#64748b"/></g><g class="edge"><path d="M 304 175 L 304 278" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,278 300.7,271.5 307.3,271.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="99" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="109" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">gen:literal</text><text x="109" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="241" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="251" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">gen:playful</text><text x="251" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="383" y="40" width="126" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="393" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">gen:metaphorical</text><text x="393" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="150" y="96" width="308" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Score, dedupe, and filter these names by clarity &amp; memorability:\n${JSON.string…</title><rect x="272" y="149" width="64" height="26" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="304" y="165.5" font-size="10" fill="#4c1d95" text-anchor="middle">opus</text></g><g class="agent-node"><title>Pick the top 5 with a rationale from:\n${JSON.stringify(kept.kept)}</title><rect x="272" y="278" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="294.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g></g><line x1="16" y1="383" x2="854" y2="383" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 396)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">opus</text><rect x="186.22" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="203.22" y="10.8" font-size="10.5" fill="#64748b">haiku</text><text x="250.32" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="273.98" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="300.98" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><circle cx="380.5" cy="7" r="4" fill="#334155"/><text x="390.5" y="10.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>

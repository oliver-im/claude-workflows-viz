<svg xmlns="http://www.w3.org/2000/svg" width="837" height="714" viewBox="0 0 837 714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="837" height="714" fill="#f8fafc"/>
<g transform="translate(0 10)"><g class="header-card"><rect x="10" y="0" width="817" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="32" y="48" font-size="22" fill="#0f172a" font-weight="700">Review a pull request</text><text x="32" y="77" font-size="13.5" fill="#475569">Review a branch&#39;s diff across independent dimensions, adversarially verify each finding, then</text><text x="32" y="96" font-size="13.5" fill="#475569">synthesize a ranked report.</text><text x="32" y="125" font-size="12.5" fill="#64748b" font-style="italic">When to use — Before merging a sizable or unfamiliar PR, when a single reviewer pass risks missing</text><text x="32" y="142" font-size="12.5" fill="#64748b" font-style="italic">correctness, security, or performance regressions.</text></g></g>
<g transform="translate(0 182)"><rect x="10" y="0" width="817" height="522" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="10" y1="127" x2="827" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="10" y1="261" x2="827" y2="261" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="10" y1="395" x2="827" y2="395" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>List changed files against the base branch and group them by subsystem so each reviewer gets a focused slice.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Map the diff</text><text x="66" y="54" font-size="12.5" fill="#475569">List changed files against the base branch and</text><text x="66" y="71" font-size="12.5" fill="#475569">group them by subsystem so each reviewer gets a</text><text x="66" y="88" font-size="12.5" fill="#475569">focused slice.</text><circle cx="70" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="81" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>One agent per dimension — correctness, security, performance — reviews its slice and reports findings with file:line.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Review by dimension</text><text x="66" y="54" font-size="12.5" fill="#475569">One agent per dimension — correctness,</text><text x="66" y="71" font-size="12.5" fill="#475569">security, performance — reviews its slice and</text><text x="66" y="88" font-size="12.5" fill="#475569">reports findings with file:line.</text><circle cx="70" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="81" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 261)"><g class="lane-label"><title>Spawn a panel of skeptics per finding, each prompted to refute it; drop anything the panel cannot defend.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Adversarially verify</text><text x="66" y="54" font-size="12.5" fill="#475569">Spawn a panel of skeptics per finding, each</text><text x="66" y="71" font-size="12.5" fill="#475569">prompted to refute it; drop anything the panel</text><text x="66" y="88" font-size="12.5" fill="#475569">cannot defend.</text><circle cx="70" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="81" y="107" font-size="11.5" fill="#64748b">model: claude-opus-4-8</text></g></g><g transform="translate(0 395)"><g class="lane-label"><title>Dedupe the survivors, rank them by severity, and write the review with reproducible citations.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Synthesize the report</text><text x="66" y="54" font-size="12.5" fill="#475569">Dedupe the survivors, rank them by severity,</text><text x="66" y="71" font-size="12.5" fill="#475569">and write the review with reproducible</text><text x="66" y="88" font-size="12.5" fill="#475569">citations.</text><circle cx="70" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="81" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g class="topology" transform="translate(336 0)"><g class="edge"><path d="M 175.16 216 L 175.16 306" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="175.16,306 171.66,299 178.66,299" fill="#64748b"/></g><g class="edge"><path d="M 304 174 L 175.16 190" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="175.16,190 181.68,185.66 182.54,192.61" fill="#64748b"/></g><g class="edge"><path d="M 304 216 L 304 306" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,306 300.5,299 307.5,299" fill="#64748b"/></g><g class="edge"><path d="M 304 174 L 304 190" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="304,190 300.5,183 307.5,183" fill="#64748b"/></g><g class="edge"><path d="M 432.84 216 L 432.84 306" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="432.84,306 429.34,299 436.34,299" fill="#64748b"/></g><g class="edge"><path d="M 304 174 L 432.84 190" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="432.84,190 425.46,192.61 426.32,185.66" fill="#64748b"/></g><g class="edge"><path d="M 175.16 332 L 304 369" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 332 L 304 369" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 432.84 332 L 304 369" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 64 L 304 167" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,167 300.5,160 307.5,160" fill="#64748b"/></g><g class="edge"><path d="M 304 376 L 304 435" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,435 300.5,428 307.5,428" fill="#64748b"/></g><g class="agent-node"><title>List changed files vs main, grouped by subsystem.</title><circle cx="304" cy="51" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><circle class="hub" cx="304" cy="170.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="175.16" cy="203" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="114.74" y="217.7" width="120.84" height="14" fill="#ffffff"/><text x="175.16" y="228" font-size="11" fill="#334155" text-anchor="middle">review:correctness</text></g><g class="agent-node"><circle cx="177.16" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="175.16" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="117.93" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="175.16" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="189.16" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="agent-node"><circle cx="304" cy="203" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="253.15" y="217.7" width="101.7" height="14" fill="#ffffff"/><text x="304" y="228" font-size="11" fill="#334155" text-anchor="middle">review:security</text></g><g class="agent-node"><circle cx="306" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="304" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="246.77" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="304" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="318" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="agent-node"><circle cx="432.84" cy="203" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="372.42" y="217.7" width="120.84" height="14" fill="#ffffff"/><text x="432.84" y="228" font-size="11" fill="#334155" text-anchor="middle">review:performance</text></g><g class="agent-node"><circle cx="434.84" cy="321" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="432.84" cy="319" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="375.61" y="333.7" width="114.46" height="14" fill="#ffffff"/><text x="432.84" y="344" font-size="11" fill="#334155" text-anchor="middle">verify:${f.title}</text><text x="446.84" y="308" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><circle class="hub" cx="304" cy="372.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><title>Write a ranked review of: ${JSON.stringify(confirmed)}</title><circle cx="304" cy="448" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g></g></g>

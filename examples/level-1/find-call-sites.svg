<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="656" viewBox="0 0 1060 656" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Find every call site of a deprecated API</title>
<desc>Sweep the repo four different ways at once — each search blind to the others — then merge the hits and drop the same site found two ways, so no call site slips through one method&#39;s blind spot.</desc>
<rect width="1060" height="656" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="1028" height="172" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Find every call site of a deprecated API</text><text x="40" y="72" font-size="13.5" fill="#475569">Sweep the repo four different ways at once — each search blind to the others — then merge the hits and drop the same site found two ways, so no call site slips</text><text x="40" y="92" font-size="13.5" fill="#475569">through one method&#39;s blind spot.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — Before removing a widely-used API, when any single search (plain grep, the type checker, the test suite) reliably misses a class of call sites the others catch.</text><rect x="40" y="130" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="145" font-size="11" fill="#334155">3 phases</text><rect x="109" y="130" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="145" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="130" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="145" font-size="11" fill="#334155">fan-out ×4</text></g></g>
<g transform="translate(0 200)"><rect x="16" y="0" width="1028" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="144" x2="1044" y2="144" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="273" x2="1044" y2="273" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Four searchers run concurrently — by name, by call graph, by test references, by dynamic dispatch — each blind to the rest so no one method&#39;s blind spot decides coverage.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Sweep every way at once</text><text x="72" y="54" font-size="12.5" fill="#475569">Four searchers run concurrently — by name, by call</text><text x="72" y="71" font-size="12.5" fill="#475569">graph, by test references, by dynamic dispatch —</text><text x="72" y="88" font-size="12.5" fill="#475569">each blind to the rest so no one method&#39;s blind spot</text><text x="72" y="105" font-size="12.5" fill="#475569">decides coverage.</text><circle cx="76" cy="120" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 144)"><g class="lane-label"><title>Union every searcher&#39;s hits and collapse the same call site surfaced two different ways into one, so a site found by both grep and the type checker counts once.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Merge and dedupe the hits</text><text x="72" y="54" font-size="12.5" fill="#475569">Union every searcher&#39;s hits and collapse the same call</text><text x="72" y="71" font-size="12.5" fill="#475569">site surfaced two different ways into one, so a site</text><text x="72" y="88" font-size="12.5" fill="#475569">found by both grep and the type checker counts once.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 273)"><g class="lane-label"><title>Turn the distinct call sites into an ordered checklist — file:line, the calling context, and the safe replacement — that a follow-up pass can work through.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Write the migration checklist</text><text x="72" y="54" font-size="12.5" fill="#475569">Turn the distinct call sites into an ordered checklist —</text><text x="72" y="71" font-size="12.5" fill="#475569">file:line, the calling context, and the safe replacement</text><text x="72" y="88" font-size="12.5" fill="#475569">— that a follow-up pass can work through.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g class="topology" transform="translate(416 0)"><g class="edge"><path d="M 304 20 L 79 20 Q 73 20 73 26 L 73 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="73,40 69.7,33.5 76.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 233 20 Q 227 20 227 26 L 227 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="227,40 223.7,33.5 230.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 375 20 Q 381 20 381 26 L 381 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="381,40 377.7,33.5 384.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 529 20 Q 535 20 535 26 L 535 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="535,40 531.7,33.5 538.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 73 94 L 73 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 227 94 L 227 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 381 94 L 381 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 535 94 L 535 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 114 L 304 166" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,166 300.7,159.5 307.3,159.5" fill="#64748b"/></g><g class="edge"><path d="M 304 192 L 304 295" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,295 300.7,288.5 307.3,288.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="4" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="14" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">sweep:by name</text><text x="14" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="158" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="168" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">sweep:by call</text><text x="168" y="70.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">graph</text><text x="168" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="312" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="322" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">sweep:by test</text><text x="322" y="70.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">references</text><text x="322" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="466" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="476" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">sweep:by dynamic</text><text x="476" y="70.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">dispatch</text><text x="476" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="61" y="110" width="486" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Merge these hits and drop the same call site found two ways:\n${JSON.stringify(…</title><rect x="272" y="166" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="182.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="agent-node"><title>Write an ordered migration checklist for:\n${JSON.stringify(distinct.sites)}</title><rect x="272" y="295" width="64" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="304" y="311.5" font-size="10" fill="#14532d" text-anchor="middle">sonnet</text></g></g><line x1="16" y1="400" x2="1044" y2="400" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 413)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">haiku</text><text x="198.55" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="222.21" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="249.21" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><circle cx="328.73" cy="7" r="4" fill="#334155"/><text x="338.73" y="10.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>
</svg>

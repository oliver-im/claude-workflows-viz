<svg xmlns="http://www.w3.org/2000/svg" width="760" height="772" viewBox="0 0 760 772" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Triage an incoming issue</title>
<desc>Classify a new bug report by subsystem, then route it to the one matching specialist to draft a fix — three of the four branches never run.</desc>
<rect width="760" height="772" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="728" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Triage an incoming issue</text><text x="40" y="72" font-size="13.5" fill="#475569">Classify a new bug report by subsystem, then route it to the one matching specialist to draft a fix — three of the</text><text x="40" y="92" font-size="13.5" fill="#475569">four branches never run.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — When reports arrive faster than one engineer can read them and almost every issue belongs to a small,</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">predictable set of subsystems.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">4 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">2 agent() calls</text><rect x="203" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">1 decision</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="728" height="538" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="744" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="249" x2="744" y2="249" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="390" x2="744" y2="390" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Read the title and body and label the issue as frontend, backend, infra, or docs, picking the single best-fit owner with a confidence score.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Classify the report</text><text x="72" y="54" font-size="12.5" fill="#475569">Read the title and body and label the issue as</text><text x="72" y="71" font-size="12.5" fill="#475569">frontend, backend, infra, or docs, picking the single</text><text x="72" y="88" font-size="12.5" fill="#475569">best-fit owner with a confidence score.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>Dispatch only to the matching agent — frontend &amp; backend, infra, or docs — so the three branches that don&#39;t apply are never spawned.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Route to a specialist</text><text x="72" y="54" font-size="12.5" fill="#475569">Dispatch only to the matching agent — frontend &amp;</text><text x="72" y="71" font-size="12.5" fill="#475569">backend, infra, or docs — so the three branches that</text><text x="72" y="88" font-size="12.5" fill="#475569">don&#39;t apply are never spawned.</text></g></g><g transform="translate(0 249)"><g class="lane-label"><title>The chosen specialist reproduces the bug, isolates the root cause, and writes a step-by-step plan naming the files to change.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft a fix</text><text x="72" y="54" font-size="12.5" fill="#475569">The chosen specialist reproduces the bug, isolates the</text><text x="72" y="71" font-size="12.5" fill="#475569">root cause, and writes a step-by-step plan naming the</text><text x="72" y="88" font-size="12.5" fill="#475569">files to change.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 390)"><g class="lane-label"><title>Post the plan back on the issue with a severity label and an owner, or escalate to a human when the classifier&#39;s confidence was low.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Reply or escalate</text><text x="72" y="54" font-size="12.5" fill="#475569">Post the plan back on the issue with a severity label</text><text x="72" y="71" font-size="12.5" fill="#475569">and an owner, or escalate to a human when the</text><text x="72" y="88" font-size="12.5" fill="#475569">classifier&#39;s confidence was low.</text></g></g><g class="topology" transform="translate(240 0)"><g class="edge"><path d="M 314 159 L 448 159 Q 454 159 454 165 L 454 241" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 169 L 304 283" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,283 300.7,276.5 307.3,276.5" fill="#64748b"/></g><g class="edge"><path d="M 304 46 L 304 149" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,149 300.7,142.5 307.3,142.5" fill="#64748b"/></g><g class="edge"><path d="M 454 241 L 454 392 Q 454 398 448 398 L 310 398 Q 304 398 304 404 L 304 412" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,412 300.7,405.5 307.3,405.5" fill="#64748b"/></g><g class="edge"><path d="M 304 323 L 304 412" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,412 300.7,405.5 307.3,405.5" fill="#64748b"/></g><g class="agent-node"><title>Classify this issue into one of ${SPECIALISTS.join(&quot;, &quot;)}:\n${args.issueBody}</title><rect x="272" y="20" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="36.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="decision"><title>confidence &lt; 0.5</title><polygon points="304,149 314,159 304,169 294,159" fill="#ffffff" stroke="#e8694a" stroke-width="1.5"/><text x="286" y="163" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">confidence &lt; 0.5</text></g><g class="agent-node"><title>As the ${area} specialist, draft a fix plan for:\n${args.issueBody}</title><rect x="257.5" y="283" width="93" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="267.5" y="299.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">fix:${area}</text><text x="267.5" y="313.5" font-size="10" fill="#14532d">sonnet</text></g><g class="control-node"><title>No agent/workflow calls were recovered in this phase.</title><circle cx="304" cy="421" r="9" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><circle cx="304" cy="421" r="5" fill="#334155"/><text x="321" y="425" font-size="11" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">end</text></g><text x="322" y="154" font-size="10.5" fill="#64748b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">yes</text><text x="310" y="182" font-size="10.5" fill="#64748b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">no</text></g><line x1="16" y1="498" x2="744" y2="498" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 511)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">haiku</text><rect x="128.02" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="145.02" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><polygon points="204.55,1 210.55,7 204.55,13 198.55,7" fill="#ffffff" stroke="#e8694a" stroke-width="1.2"/><text x="215.55" y="10.8" font-size="10.5" fill="#64748b">decision</text><circle cx="282.08" cy="7" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/><circle cx="282.08" cy="7" r="3" fill="#334155"/><text x="293.08" y="10.8" font-size="10.5" fill="#64748b">workflow ends</text></g></g>
</svg>

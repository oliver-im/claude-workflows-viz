<svg xmlns="http://www.w3.org/2000/svg" width="1059" height="774.5" viewBox="0 0 1059 774.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1059" height="774.5" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="1027" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="38" y="48" font-size="22" fill="#0f172a" font-weight="700">Choose an implementation approach</text><text x="38" y="77" font-size="13.5" fill="#475569">Draft several independent approaches to the same problem, then run a single-elimination bracket of pairwise judges until one</text><text x="38" y="96" font-size="13.5" fill="#475569">approach is left standing.</text><text x="38" y="125" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the design space is wide and quality is easier to judge head-to-head than to score in the abstract — pairwise</text><text x="38" y="142" font-size="12.5" fill="#64748b" font-style="italic">comparison beats absolute scoring.</text></g></g>
<g transform="translate(0 192)"><rect x="16" y="0" width="1027" height="566.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="156.5" x2="1043" y2="156.5" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane-empty"><line x1="16" y1="318.5" x2="1043" y2="318.5" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="433.5" x2="1043" y2="433.5" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Generate several approaches from different priorities — simplest, most scalable, least risky — each a self-contained design brief.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft the contenders</text><text x="72" y="54" font-size="12.5" fill="#475569">Generate several approaches from different</text><text x="72" y="71" font-size="12.5" fill="#475569">priorities — simplest, most scalable, least</text><text x="72" y="88" font-size="12.5" fill="#475569">risky — each a self-contained design brief.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 156.5)"><g class="lane-label"><title>Every match pits two approaches on the same rubric; the judge picks the stronger and names the single deciding factor.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Judge pairwise</text><text x="72" y="54" font-size="12.5" fill="#475569">Every match pits two approaches on the same</text><text x="72" y="71" font-size="12.5" fill="#475569">rubric; the judge picks the stronger and names</text><text x="72" y="88" font-size="12.5" fill="#475569">the single deciding factor.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 318.5)"><g class="lane-label"><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Advance the bracket</text><text x="72" y="54" font-size="11" fill="#94a3b8" font-style="italic">control only</text></g></g><g transform="translate(0 433.5)"><g class="lane-label"><title>Document the winning approach and graft in the best ideas from the contenders it beat on the way to the final.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Write up the winner</text><text x="72" y="54" font-size="12.5" fill="#475569">Document the winning approach and graft in the</text><text x="72" y="71" font-size="12.5" fill="#475569">best ideas from the contenders it beat on the</text><text x="72" y="88" font-size="12.5" fill="#475569">way to the final.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(424 0)"><g class="edge"><path d="M 304 45 L 82.03 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="82.03,61 88.76,57.01 89.26,63.99" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 230.01 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="230.01,61 236.11,56.1 237.59,62.94" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 377.99 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="377.99,61 370.41,62.94 371.89,56.1" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 525.97 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="525.97,61 518.74,63.99 519.24,57.01" fill="#64748b"/></g><g class="edge"><path d="M 82.03 87 L 82.03 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 230.01 87 L 230.01 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 377.99 87 L 377.99 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 525.97 87 L 525.97 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 119.5 L 304 135.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,135.5 300.5,128.5 307.5,128.5" fill="#64748b"/></g><g class="edge"><path d="M 304 218.5 L 304 238.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,238.5 300.5,231.5 307.5,231.5" fill="#64748b"/></g><g class="edge"><path d="M 304 142.5 L 304 196.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,196.5 300.5,189.5 307.5,189.5" fill="#64748b"/></g><g class="edge"><path d="M 304 264.5 L 304 479.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,479.5 300.5,472.5 307.5,472.5" fill="#64748b"/></g><circle class="hub" cx="304" cy="41.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="82.03" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="82.03" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">draft:simplest</text></g><g class="agent-node"><circle cx="230.01" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="230.01" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">draft:most scalable</text></g><g class="agent-node"><circle cx="377.99" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="377.99" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">draft:least risky</text></g><g class="agent-node"><circle cx="525.97" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="525.97" y="99" font-size="11" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">draft:fastest to ship</text></g><rect class="barrier" x="69.03" y="112.5" width="469.94" height="7" rx="3.5" fill="#e8694a"/><circle class="hub" cx="304" cy="139" r="3.5" fill="#94a3b8"/><g class="decision"><title>!opponent</title><polygon points="304,196.5 315,207.5 304,218.5 293,207.5" fill="#ffffff" stroke="#e8694a" stroke-width="1.4"/><text x="321" y="211.5" font-size="11" fill="#94a3b8" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">!opponent</text></g><g class="agent-node"><title>Pick the stronger approach and say why:\nA: ${a}\nB: ${opponent}</title><circle cx="304" cy="251.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><text x="325" y="255.5" font-size="12.5" fill="#334155" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">match:${i / 2}</text></g><g class="agent-node"><title>Document the winning approach: ${bracket[0]}</title><circle cx="304" cy="492.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><g class="control-arc"><path d="M 282.36 219.59 A 13 13 0 1 1 282.36 195.41" fill="none" stroke="#e8694a" stroke-width="1.4"/><polygon points="282.36,195.41 287.58,189.58 290.16,196.09" fill="#e8694a"/><text x="270.15" y="211" font-size="11" fill="#94a3b8" font-style="italic" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">yes</text></g><g class="loop-badge"><title>repeat for i &lt; bracket.length</title><text x="325" y="270.5" font-size="11" fill="#e8694a" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">↻ repeat for i &lt; bracket.length</text></g><g class="loop-badge"><title>repeat while bracket.length &gt; 1</title><text x="325" y="284.5" font-size="11" fill="#e8694a" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke fill">↻ repeat while bracket.length &gt; 1</text></g></g></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="834" viewBox="0 0 1060 834" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Choose an implementation approach</title>
<desc>Draft several independent approaches to the same problem, then run a single-elimination bracket of pairwise judges until one approach is left standing.</desc>
<rect width="1060" height="834" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="1028" height="152" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Choose an implementation approach</text><text x="40" y="72" font-size="13.5" fill="#475569">Draft several independent approaches to the same problem, then run a single-elimination bracket of pairwise judges until one approach is left standing.</text><text x="40" y="96" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the design space is wide and quality is easier to judge head-to-head than to score in the abstract — pairwise comparison beats absolute scoring.</text><rect x="40" y="110" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="125" font-size="11" fill="#334155">4 phases</text><rect x="109" y="110" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="125" font-size="11" fill="#334155">3 agent() calls</text><rect x="203" y="110" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="125" font-size="11" fill="#334155">fan-out ×4</text><rect x="277" y="110" width="54" height="22" rx="11" fill="#f1f5f9"/><text x="286" y="125" font-size="11" fill="#334155">2 loops</text><rect x="337" y="110" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="346" y="125" font-size="11" fill="#334155">1 decision</text></g></g>
<g transform="translate(0 180)"><rect x="16" y="0" width="1028" height="638" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="132" x2="1044" y2="132" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane-empty"><line x1="16" y1="370" x2="1044" y2="370" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="463" x2="1044" y2="463" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Generate several approaches from different priorities — simplest, most scalable, least risky — each a self-contained design brief.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft the contenders</text><text x="72" y="54" font-size="12.5" fill="#475569">Generate several approaches from different priorities</text><text x="72" y="71" font-size="12.5" fill="#475569">— simplest, most scalable, least risky — each a</text><text x="72" y="88" font-size="12.5" fill="#475569">self-contained design brief.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 132)"><g class="lane-label"><title>Every match pits two approaches on the same rubric; the judge picks the stronger and names the single deciding factor.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Judge pairwise</text><text x="72" y="54" font-size="12.5" fill="#475569">Every match pits two approaches on the same rubric;</text><text x="72" y="71" font-size="12.5" fill="#475569">the judge picks the stronger and names the single</text><text x="72" y="88" font-size="12.5" fill="#475569">deciding factor.</text><circle cx="76" cy="103" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 370)"><g class="lane-label"><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Advance the bracket</text><text x="72" y="53" font-size="11" fill="#64748b" font-style="italic">control only</text></g></g><g transform="translate(0 463)"><g class="lane-label"><title>Document the winning approach and graft in the best ideas from the contenders it beat on the way to the final.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Write up the winner</text><text x="72" y="54" font-size="12.5" fill="#475569">Document the winning approach and graft in the best</text><text x="72" y="71" font-size="12.5" fill="#475569">ideas from the contenders it beat on the way to the</text><text x="72" y="88" font-size="12.5" fill="#475569">final.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(416 0)"><g class="loop-frame"><title>while bracket.length &gt; 1</title><rect x="219.5" y="154" width="278.38" height="188" rx="10" fill="#fff7ed" stroke="#e8694a" stroke-width="1.25" fill-opacity="0.7" stroke-dasharray="5 4"/><path d="M 324.28 167.31 A 4.6 4.6 0 1 1 319.09 164.49" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/><polygon points="322.03,163.9 316.31,168.42 315,161.95" fill="#c2410c"/><text x="330" y="173" font-size="11" fill="#c2410c" font-weight="700">while</text><text x="363.5" y="173" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">bracket.length &gt; 1</text></g><g class="loop-frame"><title>for i &lt; bracket.length</title><rect x="233.5" y="184" width="250.38" height="144" rx="10" fill="#fff7ed" stroke="#e8694a" stroke-width="1.25" fill-opacity="0.7" stroke-dasharray="5 4"/><path d="M 324.28 197.31 A 4.6 4.6 0 1 1 319.09 194.49" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/><polygon points="322.03,193.9 316.31,198.42 315,191.95" fill="#c2410c"/><text x="330" y="203" font-size="11" fill="#c2410c" font-weight="700">for</text><text x="350.66" y="203" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">i &lt; bracket.length</text></g><g class="edge"><path d="M 304 20 L 79 20 Q 73 20 73 26 L 73 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="73,40 69.7,33.5 76.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 233 20 Q 227 20 227 26 L 227 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="227,40 223.7,33.5 230.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 375 20 Q 381 20 381 26 L 381 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="381,40 377.7,33.5 384.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 529 20 Q 535 20 535 26 L 535 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="535,40 531.7,33.5 538.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 73 94 L 73 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 227 94 L 227 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 381 94 L 381 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 535 94 L 535 110" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 252 L 304 274" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,274 300.7,267.5 307.3,267.5" fill="#64748b"/></g><g class="edge"><path d="M 304 114 L 304 232" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,232 300.7,225.5 307.3,225.5" fill="#64748b"/></g><g class="edge"><path d="M 304 314 L 304 493" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,493 300.7,486.5 307.3,486.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="4" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="14" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:simplest</text><text x="14" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="158" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="168" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:most</text><text x="168" y="70.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">scalable</text><text x="168" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="312" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="322" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:least risky</text><text x="322" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="466" y="40" width="138" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="476" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:fastest to</text><text x="476" y="70.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">ship</text><text x="476" y="84.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="61" y="110" width="486" height="4" rx="2" fill="#334155" class="barrier"/><g class="decision"><title>!opponent</title><polygon points="304,232 314,242 304,252 294,242" fill="#ffffff" stroke="#e8694a" stroke-width="1.5"/><text x="322" y="246" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">!opponent</text></g><g class="agent-node"><title>Pick the stronger approach and say why:\nA: ${a}\nB: ${opponent}</title><rect x="247.5" y="274" width="113" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="257.5" y="290.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">match:${i / 2}</text><text x="257.5" y="304.5" font-size="10" fill="#4c1d95">opus</text></g><g class="agent-node"><title>Document the winning approach: ${bracket[0]}</title><rect x="272" y="493" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="509.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="control-arc"><title>yes → continue</title><path d="M 294 242 L 280 242 Q 274 242 274 236 L 274 227 Q 274 221 280 221 L 298.5 221 Q 304 221 304 226.5 L 304 232" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="304,232 300.7,225.5 307.3,225.5" fill="#e8694a"/><text x="288" y="255" font-size="10.5" fill="#c2410c" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">yes</text></g></g><line x1="16" y1="598" x2="1044" y2="598" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 611)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">opus</text><rect x="186.22" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="203.22" y="10.8" font-size="10.5" fill="#64748b">haiku</text><text x="250.32" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="273.98" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="300.98" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><polygon points="381.5,1 387.5,7 381.5,13 375.5,7" fill="#ffffff" stroke="#e8694a" stroke-width="1.2"/><text x="392.5" y="10.8" font-size="10.5" fill="#64748b">decision</text><text x="453.03" y="10.8" font-size="10.5" fill="#475569" font-weight="700">loop</text><rect x="480.18" y="1" width="18" height="12" rx="3" fill="#fff7ed" stroke="#e8694a" stroke-width="1" fill-opacity="0.7" stroke-dasharray="3 2"/><text x="503.18" y="10.8" font-size="10.5" fill="#64748b">repeats the framed body</text><text x="639" y="10.8" font-size="10.5" fill="#475569" font-weight="700">continue</text><path d="M 687.75 7 L 699.75 7" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="705.75,7 699.25,10.3 699.25,3.7" fill="#e8694a"/><text x="710.75" y="10.8" font-size="10.5" fill="#64748b">loop again from the top</text><circle cx="845.16" cy="7" r="4" fill="#334155"/><text x="855.16" y="10.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>
</svg>

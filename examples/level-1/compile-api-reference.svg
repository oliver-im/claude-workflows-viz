<svg xmlns="http://www.w3.org/2000/svg" width="990" height="817" viewBox="0 0 990 817" role="img" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title>Compile an API reference</title>
<desc>Draft the reference from every source at once, then let a completeness critic name what&#39;s still missing — endpoints, params, error cases — and fill those gaps round after round until the critic signs off.</desc>
<rect width="990" height="817" fill="#f8fafc"/>
<g transform="translate(0 16)"><g class="header-card"><rect x="16" y="0" width="958" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="40" y="44" font-size="22" fill="#0f172a" font-weight="700">Compile an API reference</text><text x="40" y="72" font-size="13.5" fill="#475569">Draft the reference from every source at once, then let a completeness critic name what&#39;s still missing — endpoints, params, error cases — and fill those</text><text x="40" y="92" font-size="13.5" fill="#475569">gaps round after round until the critic signs off.</text><text x="40" y="116" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the cost of an incomplete reference is silent — a missing error code or undocumented param that nobody notices until it breaks — so explicit</text><text x="40" y="134" font-size="12.5" fill="#64748b" font-style="italic">gap-finding beats hoping the first pass was thorough.</text><rect x="40" y="148" width="63" height="22" rx="11" fill="#f1f5f9"/><text x="49" y="163" font-size="11" fill="#334155">3 phases</text><rect x="109" y="148" width="88" height="22" rx="11" fill="#f1f5f9"/><text x="118" y="163" font-size="11" fill="#334155">4 agent() calls</text><rect x="203" y="148" width="70" height="22" rx="11" fill="#f1f5f9"/><text x="212" y="163" font-size="11" fill="#334155">fan-out ×N</text><rect x="279" y="148" width="48" height="22" rx="11" fill="#f1f5f9"/><text x="288" y="163" font-size="11" fill="#334155">1 loop</text><rect x="333" y="148" width="68" height="22" rx="11" fill="#f1f5f9"/><text x="342" y="163" font-size="11" fill="#334155">1 decision</text></g></g>
<g transform="translate(0 218)"><rect x="16" y="0" width="958" height="583" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="16" y1="127" x2="974" y2="127" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="16" y1="396" x2="974" y2="396" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Readers fan out across the docs, the handler code, and the changelog at once, each drafting the sections it can see so the first pass is broad, not deep.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft from every source</text><text x="72" y="54" font-size="12.5" fill="#475569">Readers fan out across the docs, the handler code,</text><text x="72" y="71" font-size="12.5" fill="#475569">and the changelog at once, each drafting the sections</text><text x="72" y="88" font-size="12.5" fill="#475569">it can see so the first pass is broad, not deep.</text><circle cx="76" cy="103" r="4" fill="#dcfce7" stroke="#16a34a"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 127)"><g class="lane-label"><title>A critic names what&#39;s missing — an undocumented param, an unlisted error, a stale example — and a writer fills each gap; repeat until the critic finds nothing left.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Critique and fill the gaps</text><text x="72" y="54" font-size="12.5" fill="#475569">A critic names what&#39;s missing — an undocumented</text><text x="72" y="71" font-size="12.5" fill="#475569">param, an unlisted error, a stale example — and a</text><text x="72" y="88" font-size="12.5" fill="#475569">writer fills each gap; repeat until the critic finds nothing</text><text x="72" y="105" font-size="12.5" fill="#475569">left.</text><circle cx="76" cy="120" r="4" fill="#ede9fe" stroke="#8b5cf6"/><text x="87" y="124" font-size="11.5" fill="#64748b">model: claude-opus-5</text></g></g><g transform="translate(0 396)"><g class="lane-label"><title>Stitch the drafted and back-filled sections into one ordered reference with a consistent voice and a working table of contents.</title><circle cx="49" cy="29" r="11" fill="#334155"/><text x="49" y="32.9" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="72" y="34" font-size="15" fill="#0f172a" font-weight="700">Assemble the reference</text><text x="72" y="54" font-size="12.5" fill="#475569">Stitch the drafted and back-filled sections into one</text><text x="72" y="71" font-size="12.5" fill="#475569">ordered reference with a consistent voice and a</text><text x="72" y="88" font-size="12.5" fill="#475569">working table of contents.</text><circle cx="76" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(381 0)"><g class="loop-frame"><title>while rounds &lt; 3</title><rect x="181.5" y="149" width="306.83" height="229" rx="10" fill="#fff7ed" stroke="#e8694a" stroke-width="1.25" fill-opacity="0.7" stroke-dasharray="5 4"/><path d="M 324.28 162.31 A 4.6 4.6 0 1 1 319.09 159.49" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round"/><polygon points="322.03,158.9 316.31,163.42 315,156.95" fill="#c2410c"/><text x="330" y="168" font-size="11" fill="#c2410c" font-weight="700">while</text><text x="363.5" y="168" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">rounds &lt; 3</text></g><g class="edge"><path d="M 304 20 L 128 20 Q 122 20 122 26 L 122 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="122,40 118.7,33.5 125.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 304 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,40 300.7,33.5 307.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 304 20 L 480 20 Q 486 20 486 26 L 486 40" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="486,40 482.7,33.5 489.3,33.5" fill="#64748b"/></g><g class="edge"><path d="M 122 80 L 122 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 80 L 304 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 486 80 L 486 96" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 219 L 304 241" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,241 300.7,234.5 307.3,234.5" fill="#64748b"/></g><g class="edge"><path d="M 304 344 L 304 360" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/></g><g class="edge"><path d="M 304 261 L 304 283" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,283 300.7,276.5 307.3,276.5" fill="#64748b"/></g><g class="edge"><path d="M 304 100 L 304 179" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,179 300.7,172.5 307.3,172.5" fill="#64748b"/></g><g class="edge"><path d="M 304 364 L 304 418" fill="none" stroke="#64748b" stroke-width="1.25" stroke-linejoin="round"/><polygon points="304,418 300.7,411.5 307.3,411.5" fill="#64748b"/></g><circle class="start" cx="304" cy="20" r="5" fill="#334155"/><g class="agent-node"><rect x="39" y="40" width="166" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="49" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:the public docs</text><text x="49" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="221" y="40" width="166" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="231" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:the handler code</text><text x="231" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><g class="agent-node"><rect x="403" y="40" width="166" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.25"/><text x="413" y="56.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">draft:the changelog</text><text x="413" y="70.5" font-size="10" fill="#14532d">sonnet</text></g><rect x="110" y="96" width="388" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>What&#39;s missing from this reference — endpoints, params, error cases, examples?\…</title><rect x="217.5" y="179" width="173" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="227.5" y="195.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">critic: what&#39;s missing?</text><text x="227.5" y="209.5" font-size="10" fill="#4c1d95">opus</text></g><g class="decision"><title>audit.gaps.length === 0</title><polygon points="304,241 314,251 304,261 294,251" fill="#ffffff" stroke="#e8694a" stroke-width="1.5"/><text x="322" y="255" font-size="11" fill="#c2410c" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">audit.gaps.length === 0</text></g><g class="agent-node"><title>N from audit.gaps</title><rect x="263.5" y="289" width="93" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><rect x="260.5" y="286" width="93" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><rect x="257.5" y="283" width="93" height="40" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.25"/><text x="267.5" y="299.5" font-size="11" fill="#0f172a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">fill:${gap}</text><text x="267.5" y="313.5" font-size="10" fill="#4c1d95">opus</text><rect x="330.5" y="275" width="26" height="16" rx="8" fill="#334155"/><text x="343.5" y="286.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">×N</text><text x="257.51" y="341" font-size="10" fill="#64748b">N from </text><text x="290.28" y="341" font-size="10" fill="#64748b" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">audit.gaps</text></g><rect x="245.5" y="360" width="117" height="4" rx="2" fill="#334155" class="barrier"/><g class="agent-node"><title>Assemble the final ordered reference from:\n${JSON.stringify(sections)}</title><rect x="272" y="418" width="64" height="26" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.25"/><text x="304" y="434.5" font-size="10" fill="#1e3a8a" text-anchor="middle">haiku</text></g><g class="control-arc"><title>yes → break</title><path d="M 294 251 L 199.5 251 Q 193.5 251 193.5 257 L 193.5 401 Q 193.5 407 199.5 407 L 298.5 407 Q 304 407 304 412.5 L 304 418" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="304,418 300.7,411.5 307.3,411.5" fill="#e8694a"/><text x="288" y="264" font-size="10.5" fill="#c2410c" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">yes</text></g></g><line x1="16" y1="523" x2="974" y2="523" stroke="#e2e8f0" stroke-width="1"/><g class="legend" transform="translate(0 536)"><text x="38" y="10.8" font-size="10.5" fill="#475569" font-weight="700">model</text><rect x="73.92" y="2" width="10" height="10" rx="2.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="90.92" y="10.8" font-size="10.5" fill="#64748b">sonnet</text><rect x="134.45" y="2" width="10" height="10" rx="2.5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="151.45" y="10.8" font-size="10.5" fill="#64748b">opus</text><rect x="186.22" y="2" width="10" height="10" rx="2.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="203.22" y="10.8" font-size="10.5" fill="#64748b">haiku</text><text x="250.32" y="10.8" font-size="10.5" fill="#475569" font-weight="700">×N</text><rect x="273.04" y="4" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="271.04" y="2" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><rect x="269.04" y="0" width="14" height="9" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1"/><text x="294.04" y="10.8" font-size="10.5" fill="#64748b">one per item, counted at run time</text><text x="470.13" y="10.8" font-size="10.5" fill="#475569" font-weight="700">join</text><rect x="493.79" y="5" width="22" height="4" rx="2" fill="#334155"/><text x="520.79" y="10.8" font-size="10.5" fill="#64748b">waits for all</text><polygon points="601.3,1 607.3,7 601.3,13 595.3,7" fill="#ffffff" stroke="#e8694a" stroke-width="1.2"/><text x="612.3" y="10.8" font-size="10.5" fill="#64748b">decision</text><text x="672.83" y="10.8" font-size="10.5" fill="#475569" font-weight="700">loop</text><rect x="699.99" y="1" width="18" height="12" rx="3" fill="#fff7ed" stroke="#e8694a" stroke-width="1" fill-opacity="0.7" stroke-dasharray="3 2"/><text x="722.99" y="10.8" font-size="10.5" fill="#64748b">repeats the framed body</text><text x="38" y="30.8" font-size="10.5" fill="#475569" font-weight="700">break</text><path d="M 71.02 27 L 83.02 27" fill="none" stroke="#e8694a" stroke-width="1.4" stroke-linejoin="round"/><polygon points="89.02,27 82.52,30.3 82.52,23.7" fill="#e8694a"/><text x="94.02" y="30.8" font-size="10.5" fill="#64748b">leave the loop</text><circle cx="186.41" cy="27" r="4" fill="#334155"/><text x="196.41" y="30.8" font-size="10.5" fill="#64748b">workflow starts</text></g></g>

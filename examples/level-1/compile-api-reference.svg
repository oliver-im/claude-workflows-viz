<svg xmlns="http://www.w3.org/2000/svg" width="892" height="657.5" viewBox="0 0 892 657.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="892" height="657.5" fill="#f8fafc"/>
<g transform="translate(0 10)"><g class="header-card"><rect x="10" y="0" width="872" height="164" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="32" y="48" font-size="22" fill="#0f172a" font-weight="700">Compile an API reference</text><text x="32" y="77" font-size="13.5" fill="#475569">Draft the reference from every source at once, then let a completeness critic name what&#39;s still missing —</text><text x="32" y="96" font-size="13.5" fill="#475569">endpoints, params, error cases — and fill those gaps round after round until the critic signs off.</text><text x="32" y="125" font-size="12.5" fill="#64748b" font-style="italic">When to use — When the cost of an incomplete reference is silent — a missing error code or undocumented param that</text><text x="32" y="142" font-size="12.5" fill="#64748b" font-style="italic">nobody notices until it breaks — so explicit gap-finding beats hoping the first pass was thorough.</text></g></g>
<g transform="translate(0 182)"><rect x="10" y="0" width="872" height="465.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><g class="swimlane"></g><g class="swimlane"><line x1="10" y1="156.5" x2="882" y2="156.5" stroke="#e2e8f0" stroke-width="1"/></g><g class="swimlane"><line x1="10" y1="338.5" x2="882" y2="338.5" stroke="#e2e8f0" stroke-width="1"/></g><g transform="translate(0 0)"><g class="lane-label"><title>Readers fan out across the docs, the handler code, and the changelog at once, each drafting the sections it can see so the first pass is broad, not deep.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Draft from every source</text><text x="66" y="54" font-size="12.5" fill="#475569">Readers fan out across the docs, the handler</text><text x="66" y="71" font-size="12.5" fill="#475569">code, and the changelog at once, each drafting</text><text x="66" y="88" font-size="12.5" fill="#475569">the sections it can see so the first pass is</text><text x="66" y="105" font-size="12.5" fill="#475569">broad, not deep.</text><circle cx="70" cy="120" r="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/><text x="81" y="124" font-size="11.5" fill="#64748b">model: sonnet</text></g></g><g transform="translate(0 156.5)"><g class="lane-label"><title>A critic names what&#39;s missing — an undocumented param, an unlisted error, a stale example — and a writer fills each gap; repeat until the critic finds nothing left.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Critique and fill the gaps</text><text x="66" y="54" font-size="12.5" fill="#475569">A critic names what&#39;s missing — an undocumented</text><text x="66" y="71" font-size="12.5" fill="#475569">param, an unlisted error, a stale example — and</text><text x="66" y="88" font-size="12.5" fill="#475569">a writer fills each gap; repeat until the</text><text x="66" y="105" font-size="12.5" fill="#475569">critic finds nothing left.</text><circle cx="70" cy="120" r="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text x="81" y="124" font-size="11.5" fill="#64748b">model: claude-opus-4-8</text></g></g><g transform="translate(0 338.5)"><g class="lane-label"><title>Stitch the drafted and back-filled sections into one ordered reference with a consistent voice and a working table of contents.</title><circle cx="43" cy="29" r="11" fill="#334155"/><text x="43" y="32.7" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="66" y="34" font-size="15" fill="#0f172a" font-weight="700">Assemble the reference</text><text x="66" y="54" font-size="12.5" fill="#475569">Stitch the drafted and back-filled sections</text><text x="66" y="71" font-size="12.5" fill="#475569">into one ordered reference with a consistent</text><text x="66" y="88" font-size="12.5" fill="#475569">voice and a working table of contents.</text><circle cx="70" cy="103" r="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="81" y="107" font-size="11.5" fill="#64748b">model: haiku</text></g></g><g class="topology" transform="translate(367 0)"><g class="edge"><path d="M 304 45 L 154 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="154,61 160.59,56.78 161.33,63.74" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 304 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="304,61 300.5,54 307.5,54" fill="#64748b"/></g><g class="edge"><path d="M 304 45 L 454 61" fill="none" stroke="#64748b" stroke-width="1.1"/><polygon points="454,61 446.67,63.74 447.41,56.78" fill="#64748b"/></g><g class="edge"><path d="M 154 87 L 154 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 87 L 304 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 454 87 L 454 112.5" fill="none" stroke="#64748b" stroke-width="1.1"/></g><g class="edge"><path d="M 304 119.5 L 304 135.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,135.5 300.5,128.5 307.5,128.5" fill="#64748b"/></g><g class="edge"><path d="M 304 222.5 L 304 256.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,256.5 300.5,249.5 307.5,249.5" fill="#64748b"/></g><g class="edge"><path d="M 304 278.5 L 304 298.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,298.5 300.5,291.5 307.5,291.5" fill="#64748b"/></g><g class="edge"><path d="M 304 142.5 L 304 196.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,196.5 300.5,189.5 307.5,189.5" fill="#64748b"/></g><g class="edge"><path d="M 304 324.5 L 304 378.5" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon points="304,378.5 300.5,371.5 307.5,371.5" fill="#64748b"/></g><circle class="hub" cx="304" cy="41.5" r="3.5" fill="#94a3b8"/><g class="agent-node"><circle cx="154" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="84.01" y="88.7" width="139.98" height="14" fill="#ffffff"/><text x="154" y="99" font-size="11" fill="#334155" text-anchor="middle">draft:the public docs</text></g><g class="agent-node"><circle cx="304" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="230.82" y="88.7" width="146.36" height="14" fill="#ffffff"/><text x="304" y="99" font-size="11" fill="#334155" text-anchor="middle">draft:the handler code</text></g><g class="agent-node"><circle cx="454" cy="74" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="390.39" y="88.7" width="127.22" height="14" fill="#ffffff"/><text x="454" y="99" font-size="11" fill="#334155" text-anchor="middle">draft:the changelog</text></g><rect class="barrier" x="141" y="112.5" width="326" height="7" rx="3.5" fill="#e8694a"/><circle class="hub" cx="304" cy="139" r="3.5" fill="#94a3b8"/><g class="agent-node"><title>What&#39;s missing from this reference — endpoints, params, error cases, examples?\…</title><circle cx="304" cy="209.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="322" y="202" width="172.75" height="15.5" fill="#ffffff"/><text x="325" y="213.5" font-size="12.5" fill="#334155">critic: what&#39;s missing?</text></g><g class="decision"><title>audit.gaps.length === 0</title><polygon points="304,256.5 315,267.5 304,278.5 293,267.5" fill="#ffffff" stroke="#e8694a" stroke-width="1.4"/><rect x="318" y="261.2" width="152.74" height="14" fill="#ffffff"/><text x="321" y="271.5" font-size="11" fill="#94a3b8" font-style="italic">audit.gaps.length === 0</text></g><g class="agent-node"><circle cx="306" cy="313.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><circle cx="304" cy="311.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/><rect x="322" y="304" width="151" height="15.5" fill="#ffffff"/><text x="325" y="315.5" font-size="12.5" fill="#334155">fill each audit.gaps</text><text x="318" y="300.5" font-size="11" font-weight="700" fill="#e8694a">×N</text></g><g class="agent-node"><title>Assemble the final ordered reference from:\n${JSON.stringify(sections)}</title><circle cx="304" cy="391.5" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/></g><g class="control-arc"><path d="M 297.95 272.45 C 276 267.5 276 391.5 289 391.5" fill="none" stroke="#e8694a" stroke-width="1.4"/><polygon points="289,391.5 282,395 282,388" fill="#e8694a"/><rect x="251.86" y="260.7" width="25.14" height="14" fill="#ffffff"/><text x="274" y="271" font-size="11" fill="#94a3b8" font-style="italic" text-anchor="end">yes</text></g><g class="loop-badge"><title>repeat while rounds &lt; 3</title><rect x="322" y="218.2" width="165.5" height="14" fill="#ffffff"/><text x="325" y="228.5" font-size="11" fill="#e8694a" font-weight="600">↻ repeat while rounds &lt; 3</text></g></g></g>
</svg>
